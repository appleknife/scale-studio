<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scan screen</title>
    <link rel="stylesheet" href="../app.css" />
    <style>
      body { margin: 0; }
      pre { position: fixed; bottom: 0; right: 0; max-width: 40vw; background: #fffdfa; z-index: 99; margin: 8px; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <pre id="report">running…</pre>
    <script type="module">
      // The camera screen, using Chrome's fake device: open, see a frame, set a
      // page, take it, and finish with a JPEG. The warp, filter and save path
      // run exactly as they do with a real camera behind them.
      import { createScanner } from '../src/scanview.js';

      const problems = [];
      const log = [];
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const until = async (fn, ms = 6000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) {
          const v = fn();
          if (v) return v;
          await wait(50);
        }
        throw new Error('timed out');
      };

      let saved = null;
      const api = createScanner({ root: document.getElementById('host'), onSave: (files, title) => (saved = { files, title }) });

      try {
        await api.open();
        await until(() => api.running);
        const video = document.querySelector('[data-el="video"]');
        await until(() => video.videoWidth > 10);
        log.push('video ' + video.videoWidth + 'x' + video.videoHeight);
        if (document.querySelector('[data-el="scan"]').hidden) problems.push('the scan screen is hidden');
        if (!document.querySelector('[data-act="shoot"]')) problems.push('no shutter');

        api.setQuad([[0.12, 0.12], [0.88, 0.12], [0.88, 0.88], [0.12, 0.88]]);
        await api.shoot();
        if (api.pages !== 1) problems.push('pages after shoot: ' + api.pages);
        log.push('pages: ' + api.pages);

        // Filter choice, then a second page and undo it.
        document.querySelector('[data-filter="bw"]').click();
        if (!document.querySelector('[data-filter="bw"]').classList.contains('is-on')) problems.push('filter did not select');
        await api.shoot();
        if (api.pages !== 2) problems.push('second page missing: ' + api.pages);
        document.querySelector('[data-act="undo"]').click();
        if (api.pages !== 1) problems.push('undo left ' + api.pages);
        log.push('second page and undo ok');

        await api.finish();
        await until(() => saved);
        if (saved.files.length !== 1) problems.push('files saved: ' + saved.files.length);
        if (saved.files[0].type !== 'image/jpeg') problems.push('type ' + saved.files[0].type);
        if (!/^scan-01\.jpg$/.test(saved.files[0].name)) problems.push('name ' + saved.files[0].name);
        if (!/^Scan /.test(saved.title)) problems.push('title ' + saved.title);
        const bmp = await createImageBitmap(saved.files[0]);
        log.push('saved ' + bmp.width + 'x' + bmp.height + ' ' + (saved.files[0].size >> 10) + 'kB');
        if (!(bmp.width > 40 && bmp.height > 40)) problems.push('saved image too small');
        bmp.close?.();
        if (api.running) problems.push('camera still running after finish');
      } catch (err) {
        problems.push('exception: ' + err.message + ' @ ' + (err.stack || '').split('\n')[1]);
      }

      document.getElementById('report').textContent = problems.length ? problems.join('\n') : 'ok\n' + log.join('\n');
      fetch('/result', { method: 'POST', body: JSON.stringify({ stage: 'sheet-scan', problems, log: log.join('\n') }, null, 2) });
    </script>
  </body>
</html>
