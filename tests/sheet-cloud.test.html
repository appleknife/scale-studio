<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dropbox shelf bridge</title>
    <link rel="stylesheet" href="../app.css" />
    <style>
      body { margin: 0; }
      pre { position: fixed; bottom: 0; right: 0; max-width: 45vw; background: #fffdfa; z-index: 99; margin: 8px; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <pre id="report">running…</pre>
    <script type="module">
      // The cloud panel, with the Dropbox endpoint stubbed: the token, listing
      // and download shapes are exactly what dropbox.js expects, so what is
      // exercised is the app's own browse/import path.
      import { createSheetView } from '../src/sheetview.js';
      import * as Lib from '../src/sheetlib.js';

      const PDF = 'JVBERi0xLjQKJeLjz9MKMSAwIG9iago8PC9UeXBlL0NhdGFsb2cvUGFnZXMgMiAwIFI+PgplbmRvYmoKMiAwIG9iago8PC9UeXBlL1BhZ2VzL0tpZHNbMyAwIFJdL0NvdW50IDE+PgplbmRvYmoKMyAwIG9iago8PC9UeXBlL1BhZ2UvUGFyZW50IDIgMCBSL01lZGlhQm94WzAgMCAyMDAgMzAwXS9SZXNvdXJjZXM8PC9Gb250PDwvRjEgNCAwIFI+Pj4+L0NvbnRlbnRzIDUgMCBSPj4KZW5kb2JqCjQgMCBvYmoKPDwvVHlwZS9Gb250L1N1YnR5cGUvVHlwZTEvQmFzZUZvbnQvSGVsdmV0aWNhPj4KZW5kb2JqCjUgMCBvYmoKPDwvTGVuZ3RoIDQyPj4Kc3RyZWFtCkJUIC9GMSAxOCBUZiAyMCAyNTAgVGQgKFNoZWV0IE11c2ljKSBUaiBFVAplbmRzdHJlYW0KZW5kb2JqCnhyZWYKMCA2CjAwMDAwMDAwMDAgNjU1MzUgZiAKMDAwMDAwMDAxNSAwMDAwMCBuIAowMDAwMDAwMDYwIDAwMDAwIG4gCjAwMDAwMDAxMTEgMDAwMDAgbiAKMDAwMDAwMDIyMyAwMDAwMCBuIAowMDAwMDAwMjg2IDAwMDAwIG4gCnRyYWlsZXIKPDwvU2l6ZSA2L1Jvb3QgMSAwIFI+PgpzdGFydHhyZWYKMzc2CiUlRU9GCg==';

      const problems = [];
      const log = [];
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const until = async (fn, ms = 6000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) {
          const v = fn();
          if (v) return v;
          await wait(40);
        }
        throw new Error('timed out');
      };
      const untilAsync = async (fn, ms = 6000) => {
        const end = Date.now() + ms;
        while (Date.now() < end) {
          if (await fn()) return true;
          await wait(60);
        }
        throw new Error('timed out (async)');
      };
      const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      function wav(seconds = 2) {
        const rate = 8000;
        const n = seconds * rate;
        const buf = new ArrayBuffer(44 + n * 2);
        const v = new DataView(buf);
        const s = (at, t) => [...t].forEach((c, i) => v.setUint8(at + i, c.charCodeAt(0)));
        s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVEfmt ');
        v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
        v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data');
        v.setUint32(40, n * 2, true);
        for (let i = 0; i < n; i += 1) v.setInt16(44 + i * 2, Math.round(Math.sin((2 * Math.PI * 440 * i) / rate) * 11000), true);
        return new Uint8Array(buf);
      }

      // A tiny Dropbox: one folder, one PDF, one WAV, one unsupported file.
      const listing = (path) =>
        path === '/Music'
          ? [
              { '.tag': 'file', name: 'Bach.pdf', size: 556, path_lower: '/music/bach.pdf' },
              { '.tag': 'file', name: 'backing.wav', size: 30000, path_lower: '/music/backing.wav' },
              { '.tag': 'file', name: 'readme.txt', size: 10, path_lower: '/music/readme.txt' },
            ]
          : [{ '.tag': 'folder', name: 'Music', path_lower: '/music' }];

      window.__stubLog = [];
      const realFetch = window.fetch.bind(window);
      window.fetch = async (url, options = {}) => {
        const u = String(url);
        if (u.includes('/oauth2/token')) {
          return new Response(JSON.stringify({ access_token: 'tok', refresh_token: 'ref', expires_in: 14400 }), { status: 200 });
        }
        if (u.endsWith('/files/list_folder')) {
          const body = JSON.parse(options.body || '{}');
          window.__stubLog.push(body.path);
          return new Response(JSON.stringify({ entries: listing(body.path), has_more: false }), { status: 200 });
        }
        if (u.endsWith('/files/download')) {
          const arg = JSON.parse(options.headers['Dropbox-API-Arg']);
          if (arg.path.endsWith('.pdf')) return new Response(bytes(PDF), { status: 200 });
          return new Response(wav(), { status: 200 });
        }
        return realFetch(url, options);
      };

localStorage.setItem('scaleStudio.dropbox', JSON.stringify({ appKey: 'test-key' }));
      sessionStorage.setItem('scaleStudio.dropboxPkce', JSON.stringify({ verifier: 'v', state: 's' }));
      history.replaceState(null, '', '?code=one&state=s');
      window.confirm = () => true;
      const root = document.getElementById('host');
      const view = createSheetView({ root, profileId: () => 'cloud-tester', onBack: () => {} });

      try {
        view.open();
        await until(() => document.querySelector('.sheet-empty'));
        document.querySelector('[data-act="cloud"]').click();
        await until(() => document.querySelector('[data-act="cloudDir"]'));
        if (location.search) problems.push('the callback query stayed in the address');
        const folder = document.querySelector('[data-act="cloudDir"]');
        if (folder.dataset.path !== '/Music') problems.push('folder row path is ' + folder.dataset.path);
        log.push('root listing shown');
        folder.click();
        await wait(1200);
        log.push('paths=' + JSON.stringify(window.__stubLog) + ' itemPath=' + JSON.stringify(document.querySelector('[data-act=cloudDir]')?.dataset.path));
        await until(() => document.querySelector('[data-act="cloudGet"]'));
        const names = [...document.querySelectorAll('.cloud-item-name')].map((n) => n.textContent);
        log.push('folder: ' + names.join(', '));
        if (names.join(',') !== 'Bach.pdf,backing.wav') problems.push('unsupported file leaked: ' + names.join(','));

        // A piece downloads and lands on the shelf.
        document.querySelector('[data-act="cloudGet"]').click();
        const card = await until(() => document.querySelector('.sheet-card'));
        if (!/Bach/.test(card.textContent)) problems.push('the piece was not named from Dropbox');
        log.push('pdf imported');
        await until(() => document.querySelector('.page-image'));
        await wait(1500);
        log.push('readerHidden=' + document.querySelector('.reader')?.hidden + ' media=' + (document.querySelector('.page-media')?.innerHTML || '').slice(0, 80));

        // An audio file, with the piece open, becomes its track.
        document.querySelector('[data-act="cloud"]').click();
        const audioRow = await until(() => document.querySelector('[data-act="cloudAudio"]'));
        audioRow.click();
        await until(() => document.querySelector('.reader-live'));
        await untilAsync(async () => {
          const id = (await Lib.listSheets('cloud-tester'))[0]?.id;
          return id && (await Lib.getAudio(id)).length === 1;
        });
        const sheetRow = (await Lib.listSheets('cloud-tester'))[0];
        const tracks = await Lib.getAudio(sheetRow.id);
        if (tracks[0].name !== 'backing.wav') problems.push('track name ' + tracks[0].name);
        log.push('audio attached: ' + tracks[0].name);

        // Up and sign-out leave nothing behind but the app key.
        document.querySelector('[data-act="cloud"]').click();
        await until(() => document.querySelector('[data-act="cloudSignOut"]'));
        document.querySelector('[data-act="cloudSignOut"]').click();
        await until(() => document.querySelector('[data-act="cloudConnect"]'));
        const stored = JSON.parse(localStorage.getItem('scaleStudio.dropbox'));
        if (stored.refreshToken) problems.push('sign-out kept the refresh token');
        log.push('signed out, key kept: ' + stored.appKey);
      } catch (err) {
        problems.push('exception: ' + err.message + ' @ ' + (err.stack || '').split('\n')[1]);
      }

      for (const row of await Lib.listSheets('cloud-tester')) await Lib.deleteSheet(row.id);

      document.getElementById('report').textContent = problems.length ? problems.join('\n') : 'ok\n' + log.join('\n');
      fetch('/result', { method: 'POST', body: JSON.stringify({ stage: 'sheet-cloud', problems, log: log.join('\n') }, null, 2) });
    </script>
  </body>
</html>
