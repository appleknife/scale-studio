<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sight-reading listening test</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      pre {
        background: #fffdfa;
        border: 1px solid #e8dfd1;
        padding: 12px;
        white-space: pre-wrap;
      }
      iframe {
        position: fixed;
        left: -4000px;
        top: 0;
        width: 1100px;
        height: 900px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <script>
      // A synthetic take is played through `routeFrame` — the very function the
      // microphone feeds — so the whole listening path is exercised headless.
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      const problems = [];
      const log = [];

      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      /** Opens the app on `url` and waits until it has booted. */
      function load(url) {
        return new Promise((resolve, reject) => {
          const frame = document.createElement('iframe');
          frame.src = url;
          frame.addEventListener('load', () => resolve(frame));
          frame.addEventListener('error', () => reject(new Error(`cannot load ${url}`)));
          document.body.appendChild(frame);
        });
      }

      /** Polls until `check` is true or the budget runs out. */
      async function until(check, budget = 8000) {
        const started = performance.now();
        while (performance.now() - started < budget) {
          if (check()) return true;
          await wait(40);
        }
        return false;
      }

      const noteName = /^[A-G][♯♭]?\d$/;

      /* ── 1. Mid-take: the needle is up and reading ──────────────────── */
      {
        // `hold` stops the feed 700 ms in, on a note deliberately 38 cents flat,
        // so the readout is still on screen when we look at it.
        const frame = await load('../index.html?sightplay=5&seed=7&detune&hold=700');
        const d = frame.contentDocument;
        const live = d.getElementById('sightLive');

        const showed = await until(() => !live.hidden);
        if (!showed) problems.push('the live readout never appeared during a take');

        const note = d.getElementById('sightLiveNote').textContent.trim();
        const cents = d.getElementById('sightLiveCents').textContent.trim();
        const marker = d.getElementById('sightMarker').style.left;
        log.push(`mid-take: note ${note} · ${cents} · needle ${marker}`);

        if (!noteName.test(note)) problems.push(`live note name looks wrong: ${note}`);
        if (!/^[+-]?\d+¢$/.test(cents)) problems.push(`live cents look wrong: ${cents}`);
        if (Math.abs(Number(cents.replace('¢', ''))) < 20) {
          problems.push(`the detuned note did not read as detuned: ${cents}`);
        }
        if (!marker || marker === '50%') problems.push(`needle did not move: ${marker}`);
        if (!d.getElementById('sightResult').hidden) problems.push('result shown during a take');
        if (d.getElementById('sightStop').hidden) {
          problems.push('Finish button not offered during a take');
        }
        frame.remove();
      }

      /* ── 2. A whole take: it finishes itself and scores ─────────────── */
      {
        const frame = await load('../index.html?sightplay=5&seed=7');
        const d = frame.contentDocument;

        const finished = await until(() => !d.getElementById('sightResult').hidden, 15000);
        if (!finished) problems.push('the take never finished and scored');

        const pct = d.getElementById('sightPct').textContent.trim();
        const rows = d.querySelectorAll('#sightParts li').length;
        log.push(`finished: ${pct} · ${rows} parts · needle hidden ${d.getElementById('sightLive').hidden}`);

        if (!/^\d+%$/.test(pct)) problems.push(`no score rendered: ${pct}`);
        else if (Number(pct.replace('%', '')) < 90) problems.push(`a clean take scored only ${pct}`);
        if (rows !== 4) problems.push(`expected four score parts, saw ${rows}`);
        if (!d.getElementById('sightLive').hidden) problems.push('needle still up after the take');
        frame.remove();
      }

      /* ── 3. The switch a mock audition will use ─────────────────────── */
      {
        const frame = await load('../index.html?sightplay=5&seed=7&live=0');
        const d = frame.contentDocument;

        const finished = await until(() => !d.getElementById('sightResult').hidden, 15000);
        if (!finished) problems.push('a take with the needle off never scored');
        if (!d.getElementById('sightLive').hidden) {
          problems.push('the needle appeared even though a take asked for it to stay off');
        }
        log.push(`needle off: ${d.getElementById('sightPct').textContent.trim()}`);
        frame.remove();
      }

      /* ── 4. Walking away mid-take stops the counting ───────────────── */
      {
        const frame = await load('../index.html?sightleak');
        const d = frame.contentDocument;
        await wait(400);
        if (d.getElementById('sightLiveNote').textContent.trim() !== '—') {
          problems.push('a reading survived the student leaving the take');
        }
        if (!d.getElementById('sightLive').hidden) {
          problems.push('the needle came back after the view was left');
        }
        if (!d.getElementById('sightResult').hidden) {
          problems.push('a take that was walked away from still scored');
        }
        log.push('left mid-take: nothing counted');
        frame.remove();
      }

      /* ── 5. A stumble, then a restart ──────────────────────────────── */
      //
      // The question a teacher asks about a test: if a student freezes halfway
      // and then picks the piece up again in a later bar, does the app know where
      // they came back in? It is answered on the frames, without a microphone: the
      // score is matched to what was *heard* by pitch, not by clock, so the notes
      // played after the gap should land on the notes written where they resumed.
      {
        const { analyzeSightTake } = await import('../src/analyze.js');
        const { generatePassage, flatten } = await import('../src/sightreading.js');

        const passage = generatePassage({ level: 5, seed: 4471 });
        const perBar = passage.perBar;
        // `start` is measured inside its bar, so positions in the whole passage
        // need the bar's own offset added — the same arithmetic the analyser does.
        const events = flatten(passage)
          .filter((e) => !e.rest && e.note)
          .map((e) => ({ ...e, abs: (e.bar - 1) * perBar + e.start }));
        // Bars 3 and 4 are what the student stumbles through and abandons; bar 5
        // onwards is where they pick the piece up again.
        const freezeFrom = 2 * perBar;
        const resumeAt = 4 * perBar;
        const before = events.filter((e) => e.abs < freezeFrom);
        const after = events.filter((e) => e.abs >= resumeAt);

        const spq = 60 / 58;            // a slow-ish read, 58 to the quarter
        const frames = [];
        let t = 0;
        const play = (event, gapBefore) => {
          t += gapBefore;
          const end = t + (event.dur / 4) * spq * 0.85;
          for (let s = t; s < end; s += 0.03) {
            frames.push({
              t: s,
              freq: 440 * Math.pow(2, (event.midi - 69) / 12),
              clarity: 0.96,
              rms: 0.06,
            });
          }
          t = end;
        };
        before.forEach((e, i) => play(e, i === 0 ? 0 : 0.02));
        // the freeze: three seconds of nothing at all
        t += 3.0;
        after.forEach((e) => play(e, 0.02));

        const result = analyzeSightTake(frames, passage);
        const resumed = result.results.filter(
          (r) => r.event.abs >= resumeAt && r.status === 'exact',
        ).length;
        const skipped = result.results.filter(
          (r) => r.event.abs >= freezeFrom && r.event.abs < resumeAt,
        );
        const skippedMissed = skipped.filter((r) => r.status === 'missed').length;
        log.push(
          `restart: ${resumed}/${after.length} notes after the gap matched their own place · ` +
            `${skippedMissed}/${skipped.length} notes skipped during the freeze counted as missed · ` +
            `score ${result.score}%`,
        );
        if (resumed < after.length - 1) {
          problems.push(
            `a restart was not followed: only ${resumed} of ${after.length} notes after the gap were matched`,
          );
        }
        // Which *particular* notes were skipped is not always knowable from the
        // sound: a figure that occurs twice in the page fits two readings equally
        // well — "skipped five and resumed mid-bar" and "skipped nine and resumed
        // at the next bar" — and the alignment takes the one that leaves fewer
        // notes unplayed, which is usually right and occasionally blames the wrong
        // bar. Measured over forty passages: five take the cheaper reading, none of
        // them score above 88% against 100 for a clean read, and the run after the
        // gap is always followed. So what is required is that the notes are
        // *accounted for* — five written notes unplayed is five missed, wherever
        // the app places them — and that the take is penalised for the gap.
        if (result.missed.length < skipped.length - 1) {
          problems.push(
            `only ${result.missed.length} written notes went unaccounted for, with ${skipped.length} skipped — the take has been flattered`,
          );
        }
        log.push(
          `  (${skippedMissed} of the ${skipped.length} placed inside the skipped bars; ${result.missed.length} unplayed in the whole take)`,
        );
        if (result.score >= 96) {
          problems.push(`a take with a three-second freeze still scored ${result.score}%`);
        }
      }

      /* ── 6. Going *back* to pick it up ─────────────────────────────── */
      //
      // The other half of the same question: a student freezes at bar 5 and then
      // starts again from bar 3. Nothing can be "matched back in", because the
      // notes that follow run backwards through the page — so the alignment reads
      // the replay as *extra* notes (the written ones all sounded at least once)
      // and the jump shows up in the pulse as a stop. What it must not do is mark
      // the whole passage wrong, and what it must not do either is call it clean.
      {
        const { analyzeSightTake } = await import('../src/analyze.js');
        const { generatePassage, flatten } = await import('../src/sightreading.js');

        const passage = generatePassage({ level: 5, seed: 4471 });
        const perBar = passage.perBar;
        const events = flatten(passage)
          .filter((e) => !e.rest && e.note)
          .map((e) => ({ ...e, abs: (e.bar - 1) * perBar + e.start }));

        const spq = 60 / 58;
        const frames = [];
        let t = 0;
        const play = (event, gapBefore) => {
          t += gapBefore;
          const end = t + (event.dur / 4) * spq * 0.85;
          for (let s = t; s < end; s += 0.03) {
            frames.push({
              t: s,
              freq: 440 * Math.pow(2, (event.midi - 69) / 12),
              clarity: 0.96,
              rms: 0.06,
            });
          }
          t = end;
        };
        // Bars 1–4, then a three-second freeze, then the run from bar 3 again.
        const firstPass = events.filter((e) => e.abs < 4 * perBar);
        const replay = events.filter((e) => e.abs >= 2 * perBar);
        firstPass.forEach((e, i) => play(e, i === 0 ? 0 : 0.02));
        t += 3.0;
        replay.forEach((e) => play(e, 0.02));

        const result = analyzeSightTake(frames, passage);
        const clean = analyzeSightTake(
          (() => {
            const f = [];
            let s = 0;
            for (const e of events) {
              const end = s + (e.dur / 4) * spq * 0.85;
              for (let k = s; k < end; k += 0.03) {
                f.push({ t: k, freq: 440 * Math.pow(2, (e.midi - 69) / 12), clarity: 0.96, rms: 0.06 });
              }
              s = end + 0.02;
            }
            return f;
          })(),
          passage,
        );
        log.push(
          `rewind: score ${result.score}% (clean ${clean.score}%) · ${result.missed.length} missed · ` +
            `${result.extras.length} extra · ${result.stops} stops · every written note heard ${result.exact === result.expected}`,
        );
        if (result.exact !== result.expected) {
          problems.push(
            `a replayed passage lost ${result.expected - result.exact} written notes — going back must not mark the page wrong`,
          );
        }
        if (result.extras.length < 5) {
          problems.push(`the replay was not counted as extra notes (${result.extras.length})`);
        }
        if (result.stops < 1) {
          problems.push('the jump back was not counted as a stop');
        }
        if (result.score >= clean.score) {
          problems.push(`a replayed passage scored ${result.score}%, no worse than a clean read`);
        }
        if (result.score < 80) {
          problems.push(`a replayed passage scored ${result.score}% — harsher than a judge`);
        }
      }

      /* ── 7. A held note that stops early ───────────────────────────── */
      //
      // The one reading the app only ever guesses at, because a note's end is
      // decided by when the sound stops and a live room shortens that. Here the
      // long notes are played at half their written value on purpose: the app
      // should notice, and it should say so as a question rather than a verdict.
      {
        const { analyzeSightTake } = await import('../src/analyze.js');
        const { generatePassage, flatten } = await import('../src/sightreading.js');

        let passage = null;
        let events = null;
        // A passage with at least three quarter-or-longer notes to judge.
        for (let seed = 0; seed < 200 && !passage; seed++) {
          const p = generatePassage({ level: 5, seed });
          const e = flatten(p).filter((x) => !x.rest && x.note);
          if (e.filter((x) => x.dur >= 4).length >= 3) {
            passage = p;
            events = e;
          }
        }

        if (!passage) {
          problems.push('no passage with long enough notes to test the length reading');
        } else {
          const spq = 60 / 58;
          const make = (hold) => {
            const frames = [];
            let t = 0;
            for (const e of events) {
              const full = (e.dur / 4) * spq;
              const sounding = e.dur >= 4 ? full * hold : full * 0.85;
              for (let s = t; s < t + sounding; s += 0.03) {
                frames.push({ t: s, freq: 440 * Math.pow(2, (e.midi - 69) / 12), clarity: 0.96, rms: 0.06 });
              }
              t += full;
            }
            return frames;
          };

          const honest = analyzeSightTake(make(0.9), passage);
          const clipped = analyzeSightTake(make(0.45), passage);
          log.push(
            `note lengths: held ${honest.shortHeld ? 'flagged' : 'not flagged'} · ` +
              `short ${clipped.shortHeld ? `${(clipped.shortHeld.ratio * 100).toFixed(0)}% of written` : 'not flagged'}`,
          );
          if (honest.shortHeld) problems.push('a passage of full-length notes was called short');
          if (!clipped.shortHeld) problems.push('notes played at half their length were not noticed');
        }
      }

      /* ── 8. An assisted run ─────────────────────────────────────────── */
      //
      // The count-in has to appear, clear itself, and then the take has to run
      // and score like any other — and the whole thing has to end on its own.
      // The teacher's report was a run that appeared to freeze and clicks that
      // carried on after leaving; this walks the normal assisted path.
      {
        const frame = await load('../index.html?sightplay=5&seed=7&assist');
        const d = frame.contentDocument;
        await wait(1200);
        const counted = !d.getElementById('countIn').hidden;
        await until(() => d.getElementById('countIn').hidden, 6000);
        const cleared = d.getElementById('countIn').hidden;
        const finished = await until(() => !d.getElementById('sightResult').hidden, 20000);
        const pct = d.getElementById('sightPct').textContent.trim();
        log.push(`assisted: count-in ${counted ? 'shown' : 'missing'} · cleared ${cleared} · scored ${pct}`);

        if (!counted) problems.push('an assisted run showed no count-in');
        if (!cleared) problems.push('the count-in never cleared');
        if (!finished) problems.push('an assisted run never finished and scored');
        if (!/^\d+%$/.test(pct)) problems.push(`an assisted run scored "${pct}"`);
        if (d.getElementById('sightStart').hidden) problems.push('the start button did not come back');
        frame.remove();
      }

      /* ── 9. The microphone warm-up ─────────────────────────────────── */
      //
      // On a phone the capture path wakes a second or two after the button, and a
      // count-in that runs during that window sends the student's first bar into a
      // microphone that is not listening. So an assisted run waits for the first
      // frame — which is what this page holds back for 600 ms, then releases.
      {
        const frame = await load('../index.html?sightplay=5&seed=7&assist&warm');
        const d = frame.contentDocument;
        await wait(250);
        const early = !d.getElementById('countIn').hidden;
        const warming = d.getElementById('sightStatus').textContent.trim().length > 0;
        const started = await until(() => !d.getElementById('countIn').hidden, 4000);
        const cleared = await until(() => d.getElementById('countIn').hidden, 9000);
        const finished = await until(() => !d.getElementById('sightResult').hidden, 20000);
        const pct = d.getElementById('sightPct').textContent.trim();
        log.push(
          `warm-up: count-in before any frame ${early ? 'early (wrong)' : 'held'} · ` +
            `status ${warming ? 'set' : 'missing'} · count-in ${started ? 'started' : 'never started'} · ` +
            `cleared ${cleared} · scored ${pct}`,
        );

        if (early) problems.push('the count-in began before the microphone delivered anything');
        if (!warming) problems.push('nothing told the student the microphone was waking up');
        if (!started) problems.push('the first frame did not start the count-in');
        if (!cleared) problems.push('the warm-up run never cleared its count-in');
        if (!finished) problems.push('a warmed-up assisted run never finished and scored');
        if (!/^\d+%$/.test(pct)) problems.push(`a warmed-up assisted run scored "${pct}"`);
        frame.remove();
      }

      /* ── 10. Walking out of an assisted run ────────────────────────── */
      //
      // The teacher's report was clicks that kept going and a line that kept
      // moving after they had gone back to the menu. The click track is scheduled
      // on the audio clock, so nothing but an explicit stop will end it: leaving
      // the screen has to reach stopAssistAudio() and hidePlayhead().
      {
        const frame = await load('../index.html?sightplay=5&seed=7&assist');
        const d = frame.contentDocument;
        const w = frame.contentWindow;
        await until(() => !d.getElementById('countIn').hidden, 4000);
        await until(() => d.getElementById('countIn').hidden, 9000);
        await wait(300);
        d.getElementById('sightBack').click();
        await wait(200);
        const line = d.querySelector('.sight-playhead');
        const left = {
          countIn: d.getElementById('countIn').hidden,
          line: !line || line.style.opacity === '0',
          start: !d.getElementById('sightStart').hidden,
          menu: !d.getElementById('view-choose').hidden,
        };
        log.push(
          `left mid-run: count-in ${left.countIn ? 'hidden' : 'still up'} · ` +
            `line ${left.line ? 'hidden' : 'still moving'} · start ${left.start ? 'back' : 'missing'} · ` +
            `menu ${left.menu ? 'shown' : 'missing'}`,
        );
        if (!left.countIn) problems.push('leaving left the count-in on screen');
        if (!left.line) problems.push('leaving left the playhead running');
        if (!left.start) problems.push('leaving did not hand the start button back');
        if (!left.menu) problems.push('leaving did not reach the menu');
        const clicksLeft = typeof w.__assistClicks === 'function' ? w.__assistClicks() : 0;
        if (clicksLeft) problems.push(`${clicksLeft} click(s) were still scheduled after leaving`);
        frame.remove();
      }

      /* ── 11. The moving line crosses the whole page ────────────────── */
      //
      // The teacher's report: with the clicks on, the line vanished after about
      // two bars. The clock ran in sixteenths while the length of the passage was
      // worked out in quarters, so the line finished a quarter of the way through
      // and was then hidden — two bars of eight. `?sightwalk` walks the line over
      // the whole passage and records, at every step, which bar it is actually on
      // (read from the note it landed on, not from the clock), so a clock running
      // at the wrong speed cannot hide behind a plausible-looking picture.
      // Seed 5 is cut time, whose tempo mark draws a half note of its own: the line
      // once counted it as a note, jumped back to the top-left after the first
      // system and ran a note behind for the rest of the page.
      for (const [width, seed] of [[400, 7], [1100, 7], [400, 5], [1100, 5]]) {
        const frame = document.createElement('iframe');
        frame.style.cssText =
          `position:fixed;left:-4000px;top:0;width:${width}px;height:900px;border:0`;
        frame.src = `../index.html?sightwalk=5&seed=${seed}`;
        document.body.appendChild(frame);
        await new Promise((r) => frame.addEventListener('load', r));
        const w = frame.contentWindow;
        const walked = await until(() => Boolean(w.__sightWalk), 8000);
        const steps = w.__sightWalk || [];
        const bars = steps.map((s) => s.bar);
        const seen = [...new Set(bars)];
        const hidden = steps.filter(
          (s) => s.opacity !== '0.85' || !Number.isFinite(s.x) || !Number.isFinite(s.y1) || s.y2 <= s.y1,
        );
        const rows = [...new Set(steps.map((s) => Math.round(s.y1)))].sort((a, b) => a - b);
        log.push(
          `line at ${width}px: ${steps.length} steps · bars ${seen.join(',')} · ` +
            `rows ${rows.length} · invisible ${hidden.length}`,
        );
        if (!walked) problems.push(`the line never walked at ${width}px`);
        if (seen.length !== 8) problems.push(`the line crossed ${seen.length} of 8 bars at ${width}px`);
        if (bars.some((b, k) => k > 0 && b < bars[k - 1]))
          problems.push(`the line went backwards through the bars at ${width}px`);
        if (hidden.length) problems.push(`the line was invisible for ${hidden.length} steps at ${width}px`);
        const jumps = steps.filter((st, k) => {
          const prev = steps[k - 1];
          if (!prev) return false;
          if (st.y1 < prev.y1 - 1) return true; // back up to an earlier row
          return Math.abs(st.y1 - prev.y1) < 1 && st.x < prev.x - 1; // back along a row
        });
        if (jumps.length) {
          problems.push(`the line jumped backwards ${jumps.length} times at ${width}px (seed ${seed})`);
        }
        // Two bars to a system is the phone's layout; four is the wide one.
        const systems = width < 560 ? 4 : 2;
        if (rows.length !== systems)
          problems.push(`${systems} rows expected at ${width}px, saw ${rows.length}`);
        frame.remove();
      }

      /* ── 12. iOS takes the microphone away ─────────────────────────── */
      //
      // Locking the screen or taking a call moves the audio context to
      // "interrupted" and the analyser returns the last buffer over and over — or
      // nothing. A take running at that moment must be closed without a score,
      // because filing silence as a bad performance is the one thing worse than
      // saying nothing. This drives the same handler the context's `statechange`
      // and the interval both call.
      {
        const frame = await load('../index.html?sightplay=5&seed=7&assist');
        const d = frame.contentDocument;
        const w = frame.contentWindow;
        await until(() => !d.getElementById('countIn').hidden, 4000);
        await until(() => d.getElementById('countIn').hidden, 9000);
        await wait(200);
        const running = !d.getElementById('sightStop').hidden;
        w.__micStalled();
        await wait(300);
        const status = d.getElementById('sightStatus').textContent.trim();
        const paused = {
          stopGone: d.getElementById('sightStop').hidden,
          startBack: !d.getElementById('sightStart').hidden,
          scored: !d.getElementById('sightResult').hidden,
          line: !d.querySelector('.sight-playhead') || d.querySelector('.sight-playhead').style.opacity === '0',
        };
        log.push(
          `mic taken away mid-take: was running ${running} · stop ${paused.stopGone ? 'hidden' : 'still up'} · ` +
            `start ${paused.startBack ? 'back' : 'missing'} · scored ${paused.scored ? 'yes (wrong)' : 'no'} · ` +
            `line ${paused.line ? 'hidden' : 'still moving'} · said "${status}"`,
        );
        if (!running) problems.push('the take was not running when the microphone was taken away');
        if (!paused.stopGone || !paused.startBack)
          problems.push('taking the microphone away did not hand the buttons back');
        if (paused.scored) problems.push('a take that lost its microphone was scored anyway');
        if (!paused.line) problems.push('the line kept moving after the microphone was taken away');
        if (!status) problems.push('nothing told the student the microphone had been paused');
        frame.remove();
      }

      /* ── 13. A phone's first notes ─────────────────────────────────── */
      //
      // The teacher started a scale take and the needle sat still for four or five
      // seconds. The cause was the start rule: a "confident" note meant clarity
      // above 0.7 at a fixed level, three frames running, and a phone's first
      // seconds — gain control winding up, a fresh bow attack smearing YIN — do
      // not reliably produce that. A note that merely *holds* for six frames now
      // starts the take too. This page feeds the app that kind of take.
      {
        const frame = await load('../index.html?sightplay=5&seed=7&soft');
        const d = frame.contentDocument;
        const finished = await until(() => !d.getElementById('sightResult').hidden, 20000);
        const pct = d.getElementById('sightPct').textContent.trim();
        log.push(`soft take (clarity 0.58, rms 0.0045): ${finished ? `scored ${pct}` : 'never started'}`);
        if (!finished) problems.push('a quiet, smeared take never started');
        if (!/^\d+%$/.test(pct)) problems.push(`a quiet, smeared take scored "${pct}"`);
        frame.remove();
      }

      document.getElementById('report').textContent = problems.length
        ? `SIGHT LISTEN FAILED\n${problems.map((p) => `· ${p}`).join('\n')}\n\n${log.join('\n')}`
        : `SIGHT LISTEN OK\n${log.join('\n')}`;
      document.title = problems.length ? 'SIGHT LISTEN FAILED' : 'SIGHT LISTEN OK';

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'sight-listen', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
