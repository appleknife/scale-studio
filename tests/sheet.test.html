<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sheet shelf</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      pre {
        background: #fffdfa;
        border: 1px solid #e8dfd1;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <script type="module">
      // The shelf's arithmetic and its store. The page reader needs a real PDF
      // and a layout, so it is checked by eye and by the click-through suite;
      // what lives here is everything that can be weighed without one.
      import * as Lib from '../src/sheetlib.js';
      import { stretchedLength, renderStretched } from '../src/tempoaudio.js';

      const problems = [];
      const log = [];
      const is = (name, got, want) => {
        if (got !== want) problems.push(`${name}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`);
      };
      const near = (name, got, want, within) => {
        if (!(Math.abs(got - want) <= within)) problems.push(`${name}: got ${got}, want ${want} ± ${within}`);
      };

      try {
        // Names: a dash splits title from composer, an extension never leaks in.
        is('split title', Lib.splitName('Gavotte - Gossec.pdf').title, 'Gavotte');
        is('split composer', Lib.splitName('Gavotte - Gossec.pdf').composer, 'Gossec');
        is('split underscore', Lib.splitName('Wohlfahrt_Etude_2.musicxml').title, 'Wohlfahrt Etude 2');
        is('split bare', Lib.splitName('Untitled piece.pdf').composer, '');
        is('split empty', Lib.splitName('').title, 'Untitled');

        const pdf = new File(['%PDF'], 'a.pdf', { type: 'application/pdf' });
        const xml = new File(['<score/>'], 'a.musicxml', { type: '' });
        const jpg = new File(['x'], 'a.JPG', { type: '' });
        const mp3 = new File(['x'], 'a.mp3', { type: '' });
        is('kind pdf', Lib.fileKind(pdf), 'pdf');
        is('kind xml', Lib.fileKind(xml), 'musicxml');
        is('kind jpg', Lib.fileKind(jpg), 'image');
        is('kind audio', Lib.fileKind(mp3), null);
        is('audio mp3', Lib.audioKind(mp3), true);
        is('audio txt', Lib.audioKind(new File(['x'], 'a.txt')), false);

        // Pages never run past the covers.
        is('turn back', Lib.turnPage(1, 5, -1), 1);
        is('turn on', Lib.turnPage(5, 5, 1), 5);
        is('turn mid', Lib.turnPage(2, 5, 1), 3);
        is('turn empty', Lib.turnPage(1, 0, 1), 1);

        // Fit: "width" ignores the height; "page" is the smaller of the two.
        near('fit width', Lib.fitScale(600, 800, 400, 300, 'width', 0), 400 / 600, 0.001);
        near('fit page', Lib.fitScale(600, 800, 400, 300, 'page', 0), 300 / 800, 0.001);
        near('fit margin', Lib.fitScale(600, 800, 424, 300, 'width', 12), 400 / 600, 0.001);

        is('zoom floor', Lib.clampZoom(0.1), Lib.MIN_ZOOM);
        is('zoom ceiling', Lib.clampZoom(50), Lib.MAX_ZOOM);

        const crop = Lib.cropRect({ l: 0.5, r: -1, t: 0.1, b: 0.2 });
        is('crop l clamps', crop.left, 0.3);
        is('crop r floors', crop.right, 0);
        near('crop width', crop.width, 0.7, 0.0001);
        near('crop height', crop.height, 0.7, 0.0001);

        near('semitone 12', Lib.semitoneRatio(12), 2, 0.000001);
        near('semitone 0', Lib.semitoneRatio(0), 1, 0.000001);
        near('semitone down', Lib.semitoneRatio(-12), 0.5, 0.000001);

        const loop = Lib.loopWindow(10, 5, 30); // B before A is allowed to swap
        near('loop a', loop.a, 10, 0.001);
        is('loop b follows a', loop.b >= loop.a + 0.2, true);
        const atEnd = Lib.loopWindow(30, 31, 30);
        is('loop inside track', atEnd.b <= 30, true);

        is('clock', Lib.clock(187), '3:07');
        is('clock floor', Lib.clock(-4), '0:00');

        is('tone night inverts', Lib.toneFilter('night').startsWith('invert(1)'), true);
        is('tone sepia warms', Lib.toneFilter('sepia').startsWith('sepia'), true);
        is('tone paper is brightness', Lib.toneFilter('paper', 1.2), 'brightness(1.2)');

        const pts = Lib.normalizeStroke([[1.4, -2], ['x', 0.5], [0.25, 0.75]]);
        is('stroke count', pts.length, 2);
        is('stroke clamps', pts[0][0], 1);

        is('stretched length', stretchedLength(60, 0.5), 120);
        near('stretched length 1', stretchedLength(60, 1), 60, 0.001);

        // The stretch itself: a 1 s tone at half speed lasts two seconds, at
        // double speed half, and a pitch shift does not change its length.
        const measure = async (rate, semis) => {
          const ac = new OfflineAudioContext(1, 4000, 4000);
          const buf = ac.createBuffer(1, 4000, 4000);
          const data = buf.getChannelData(0);
          for (let i = 0; i < 4000; i += 1) data[i] = Math.sin((2 * Math.PI * 50 * i) / 4000);
          const out = renderStretched(ac, buf, rate, semis);
          return out.length;
        };
        near('half speed length', await measure(0.5, 0), 8000, 2);
        near('double speed length', await measure(2, 0), 2000, 2);
        near('pitch shift keeps length', await measure(1, 7), 4000, 2);

        // The shelf: write, read back, keep profiles apart, then delete all of it.
        const mine = Lib.emptySheet('tester', { title: 'Mine' });
        await Lib.saveSheet(mine);
        await Lib.saveFile(mine.id, pdf);
        await Lib.saveInk(mine.id, { 1: { strokes: [{ kind: 'pen', width: 3, pts: [[0.1, 0.2]] }], undone: [] } });
        await Lib.saveAudio(mine.id, [{ id: 't1', name: 'backing.mp3' }]);
        await Lib.saveAudioBlob(mine.id, 't1', mp3);
        const other = Lib.emptySheet('someone', { title: 'Theirs' });
        await Lib.saveSheet(other);

        const listed = await Lib.listSheets('tester');
        is('one sheet for me', listed.length, 1);
        is('title survives', listed[0].title, 'Mine');
        is('file survives', await (await Lib.getFile(mine.id)).text(), '%PDF');
        is('ink survives', (await Lib.getInk(mine.id))[1].strokes[0].pts[0][1], 0.2);
        is('audio row survives', (await Lib.getAudio(mine.id))[0].name, 'backing.mp3');
        is('audio blob survives', await (await Lib.getAudioBlob(mine.id, 't1')).text(), 'x');
        is('profiles apart', (await Lib.listSheets('someone'))[0].title, 'Theirs');

        await Lib.deleteSheet(mine.id);
        is('sheet gone', (await Lib.listSheets('tester')).length, 0);
        is('file gone', await Lib.getFile(mine.id), undefined);
        is('ink gone', Object.keys(await Lib.getInk(mine.id)).length, 0);
        is('audio gone', (await Lib.getAudio(mine.id)).length, 0);
        await Lib.deleteSheet(other.id);

        // A replayed booking: the last-opened order, newest first.
        const older = Lib.emptySheet('order', { title: 'Older', lastOpenedAt: 10, addedAt: 10 });
        const newer = Lib.emptySheet('order', { title: 'Newer', lastOpenedAt: 20, addedAt: 5 });
        await Lib.saveSheet(older);
        await Lib.saveSheet(newer);
        const ordered = await Lib.listSheets('order');
        is('newest first', ordered[0].title, 'Newer');
        await Lib.deleteSheet(older.id);
        await Lib.deleteSheet(newer.id);
        log.push('all checks ran');
      } catch (err) {
        problems.push('exception: ' + err.message + ' @ ' + (err.stack || '').split('\n')[1]);
      }

      document.getElementById('report').textContent = problems.length ? problems.join('\n') : 'ok\n' + log.join('\n');
      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'sheet', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
