<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sampler tests</title>
    <style>
      body { font: 13px/1.5 ui-monospace, monospace; margin: 16px; white-space: pre-wrap; }
      .bad { color: #a3231c; font-weight: 700; }
      .ok { color: #0a7a3d; }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <script type="module">
      // The recorded violin is data as much as code: the index has to describe
      // every take honestly, and the two decisions the sampler makes — which take
      // covers a pitch, and how far to shift it so it is in tune — can be weighed
      // exactly without decoding a single audio file.
      import {
        pickSample,
        rateFor,
        noteShape,
        loopPasses,
        LEVEL_GAIN,
        LEVEL_TILT,
        BANK_GAIN,
      } from '../src/sampler.js?v=202611025900';

      const problems = [];
      const log = [];
      const check = (ok, message) => {
        if (!ok) problems.push(message);
        return ok;
      };

      let index = null;
      try {
        const response = await fetch('../samples/index.json');
        if (!response.ok) throw new Error(`index.json ${response.status}`);
        index = await response.json();
      } catch (err) {
        problems.push(`cannot read samples/index.json: ${err.message}`);
      }

      if (index) {
        const samples = index.samples;
        log.push(`${samples.length} takes · ${index.format} · ${index.sampleRate} Hz`);

        /* ── the set as a whole ─────────────────────────────────────── */

        check(samples.length >= 18, `only ${samples.length} takes in the index`);

        const ids = new Set(samples.map((s) => s.id));
        check(ids.size === samples.length, 'two takes share an id');
        const files = new Set(samples.map((s) => s.file));
        check(files.size === samples.length, 'two takes share a file');

        // One sustained take every whole tone from G3 to F6 — the range the
        // Manual sets for level VI — or a pitch has to stretch two semitones.
        const smooth = samples.filter((s) => s.style === 'smooth').sort((a, b) => a.midi - b.midi);
        const gaps = [];
        for (let i = 1; i < smooth.length; i++) gaps.push(smooth[i].midi - smooth[i - 1].midi);
        log.push(`smooth takes: ${smooth.length}, from ${smooth[0].midi} to ${smooth.at(-1).midi}, step ${[...new Set(gaps)].join('/')}`);
        check(smooth[0].midi === 55, `the lowest sustained take is ${smooth[0].midi}, not G3 (55)`);
        check(smooth.at(-1).midi === 89, `the highest sustained take is ${smooth.at(-1).midi}, not F6 (89)`);
        check(
          new Set(gaps).size === 1 && gaps[0] === 2,
          `the sustained takes are not every whole tone: ${[...new Set(gaps)].join(', ')}`,
        );

        // Every take needs the three numbers the voice cannot work without.
        for (const s of samples) {
          if (!(s.seconds > 0.05)) problems.push(`${s.id}: ${s.seconds} s long`);
          if (!(s.gain > 0.2 && s.gain < 4)) problems.push(`${s.id}: gain ${s.gain} is out of range`);
          if (s.skip == null || s.skip < 0 || s.skip > 0.2) problems.push(`${s.id}: skip ${s.skip}`);
          if (!Number.isFinite(s.cents) || Math.abs(s.cents) > 60) problems.push(`${s.id}: cents ${s.cents}`);
        }

        // A sustained take that is shorter than its loop cannot loop, and one
        // whose loop points are backwards would click or hang.
        for (const s of smooth) {
          if (s.loopStart == null || s.loopEnd == null) {
            problems.push(`${s.id}: no loop points`);
            continue;
          }
          const length = s.loopEnd - s.loopStart;
          if (s.loopEnd <= s.loopStart) problems.push(`${s.id}: loop runs backwards`);
          // Long is good: the longer the region, the less often the take comes
          // round again on a held note.
          if (length < 0.8 || length > 1.5) problems.push(`${s.id}: loop is ${length.toFixed(2)} s`);
          // …but it must not start at the attack, or every pass would re-bow.
          if (s.loopStart < 0.2) problems.push(`${s.id}: loop starts at ${s.loopStart} s, on the attack`);
          if (s.loopEnd > s.seconds - 0.02) problems.push(`${s.id}: loop ends past the take`);
        }

        /* ── tuning: the reason the set is playable ─────────────────── */

        // Every take is shifted by its own measured error, so the pitch that
        // comes out of the speaker is the pitch on the page. The spread of the
        // raw recordings is reported: that is what the correction is for.
        const raw = smooth.map((s) => s.cents);
        log.push(
          `recorded tuning: ${Math.min(...raw).toFixed(0)} to +${Math.max(...raw).toFixed(0)} cents ` +
            `(spread ${(Math.max(...raw) - Math.min(...raw)).toFixed(0)}) — each is corrected`,
        );
        // Where a take lands, in cents against the note the page asked for. The
        // answer should be that take's own deliberate offset and nothing else:
        // the recorded error has been taken out.
        const landing = (s, midi) => {
          const recorded = 440 * 2 ** ((s.midi + (s.cents || 0) / 100 - 69) / 12);
          const heard = recorded * rateFor(s, midi);
          const wanted = 440 * 2 ** ((midi - 69) / 12);
          return 1200 * Math.log2(heard / wanted);
        };
        let worst = 0;
        for (const s of smooth) {
          for (const midi of [s.midi - 1, s.midi, s.midi + 1]) {
            worst = Math.max(worst, Math.abs(landing(s, midi) - (s.tune || 0)));
          }
        }
        check(worst < 0.01, `corrected pitches land ${worst.toFixed(3)} cents off their note`);

        // The deliberate offsets: the A takes sit high on purpose, and every
        // other take is exactly where it was measured.
        const lifted = samples.filter((s) => s.tune > 0);
        log.push(`deliberate tune: ${lifted.map((s) => `${s.id} +${s.tune}¢`).join(' · ') || 'none'}`);
        check(lifted.every((s) => s.id.startsWith('A')), 'something other than an A take was lifted');
        check(lifted.length === 3, `${lifted.length} takes carry a deliberate offset, wanted the three As`);
        const a4 = smooth.find((s) => s.id === 'A4-smooth');
        const centsAbove = landing(a4, a4.midi);
        log.push(`A4 plays ${centsAbove.toFixed(1)} cents above equal temperament`);
        check(Math.abs(centsAbove - a4.tune) < 0.1, `A4 did not land on its offset (${centsAbove.toFixed(1)}¢)`);

        // And the level: the takes were recorded quiet, so the sampler lifts the
        // whole set. The lift is in the voice, not in the files.
        log.push(`bank gain ×${BANK_GAIN} (${(20 * Math.log10(BANK_GAIN)).toFixed(0)} dB)`);
        check(BANK_GAIN > 2, 'the recorded set is not being brought up to level');
        // And the correction is doing real work: without it the same note would be
        // as far out as the take itself.
        const worstRaw = Math.max(...smooth.map((s) => Math.abs(s.cents)));
        check(worstRaw > 15, `the takes need no correction (worst ${worstRaw.toFixed(0)}¢)`);

        /* ── which take covers which note ───────────────────────────── */

        // Plain notes come from the nearest sustained take, and never from one
        // more than a semitone away.
        for (let midi = 55; midi <= 89; midi++) {
          const pick = pickSample(index, midi);
          const away = Math.abs(pick.midi - midi);
          if (pick.style !== 'smooth') problems.push(`midi ${midi} came back as a ${pick.style} take`);
          if (away > 1) problems.push(`midi ${midi} is ${away} semitones from its take`);
        }
        // Articulations use the takes recorded for them when one is close.
        const short = pickSample(index, 69, { staccato: true });
        const hard = pickSample(index, 69, { accent: true });
        const glide = pickSample(index, 71, { legato: true });
        log.push(`A4: plain ${pickSample(index, 69).id} · staccato ${short.id} · accent ${hard.id} · slur landing ${glide.id}`);
        check(short.style === 'staccato', `a staccato note took a ${short.style} sample`);
        check(hard.style === 'accent', `an accented note took a ${hard.style} sample`);
        check(glide.style === 'slurhead', `a slur landing took a ${glide.style} sample`);
        // …and fall back to the sustained note when nothing is close enough.
        const far = pickSample(index, 89, { staccato: true });
        check(far.style === 'smooth', `a staccato note at F6 took a ${far.style} sample`);

        // The loud and soft layers are derived for now. When real ones are
        // recorded they are preferred automatically — the lookup already asks
        // for the layer first and only falls back to the mezzo-forte takes.
        const soft = pickSample(index, 69, { level: 'p' });
        log.push(`a p note uses ${soft.id} (level ${soft.level}) — the soft layer is derived until it is recorded`);
        check(soft.level === 'mf', `nothing is recorded at p yet, but the lookup returned ${soft.level}`);
        const pretend = {
          samples: [
            { id: 'x-mf', style: 'smooth', level: 'mf', midi: 69, cents: 0, gain: 1 },
            { id: 'x-p', style: 'smooth', level: 'p', midi: 69, cents: 0, gain: 1 },
          ],
        };
        check(pickSample(pretend, 69, { level: 'p' }).id === 'x-p', 'a recorded p take was not preferred');
        check(pickSample(pretend, 69, { level: 'f' }).id === 'x-mf', 'a missing f take did not fall back to mf');

        /* ── how long a short note sounds ───────────────────────────── */
        //
        // A staccato take is 0.4–0.6 s and most of that is the note's own ring
        // after the bow has stopped. Cutting it at the written length is what
        // made dotted notes sound clipped; the fix is to let the take end by
        // itself and run under the next note.
        {
          const shortTake = index.samples.find((s) => s.style === 'staccato');
          const plain = index.samples.find((s) => s.style === 'smooth');
          // The figure that sounded too long: a dotted eighth and a staccato
          // sixteenth, at a level VI tempo — 0.51 s written, then 0.17 s.
          const shape = (o) => noteShape(shortTake, { rate: 1, bufferSeconds: 0.45, legato: false, ...o });
          const dotted = shape({ staccato: true, duration: 0.23, written: 0.51 });
          const sixteenth = shape({ staccato: true, duration: 0.08, written: 0.17 });
          const cut = noteShape(plain, {
            staccato: true, legato: false, duration: 0.08, written: 0.17, rate: 1, bufferSeconds: 1.9,
          });
          const held = noteShape(plain, {
            staccato: false, legato: false, duration: 0.5, written: 0.5, rate: 1, bufferSeconds: 1.9,
          });
          log.push(
            `a short note: dotted eighth rings ${dotted.want.toFixed(2)} s · sixteenth rings ` +
              `${sixteenth.want.toFixed(2)} s · sustained take cut to ${cut.want.toFixed(2)} s · ` +
              `plain note ${held.want.toFixed(2)} s`,
          );
          // The dotted note keeps a real ring…
          check(dotted.want > 0.3, `the dotted note rings for only ${dotted.want.toFixed(2)} s`);
          // …the sixteenth does not run on into the next beat, which is what made
          // the pair sound like two long notes…
          check(sixteenth.want < 0.3, `the sixteenth rings ${sixteenth.want.toFixed(2)} s — too long for its slot`);
          // …and it still rings past its written length rather than being cut.
          check(sixteenth.want > 0.17, 'the sixteenth is cut at its written length, with no ring');
          check(cut.want < 0.1, 'a short note on a sustained take is not being cut');
          check(Math.abs(held.want - 0.5) < 1e-9, 'a plain note is not its written length');
          check(dotted.fade < 0.06, 'the ring is being faded out rather than left to decay');
        }

        /* ── how a held note is stitched ────────────────────────────── */
        //
        // A whole note at level I is four seconds and the takes are under two, so
        // the note is a chain of passes through the take with crossfades between
        // them. What must hold: the chain covers the whole note, consecutive
        // passes overlap (never a gap), and no pass after the first starts at the
        // attack — that would be a re-bow in the middle of a held note.
        {
          const long = loopPasses({
            at: 1.0,
            want: 4.0,
            offset: 0.016,
            rate: 1,
            loopStart: 0.34,
            loopEnd: 1.66,
            attack: 0.004,
            release: 0.12,
          });
          const last = long[long.length - 1];
          log.push(
            `a 4 s note: ${long.length} passes · first ${long[0].from}s → ${(long[0].length).toFixed(2)} s · ` +
              `ends at ${(last.start + last.length - 1).toFixed(3)} s of the note`,
          );
          check(long.length >= 3, `a four-second note is only ${long.length} pass(es)`);
          check(Math.abs(last.start + last.length - 5.0) < 0.02, 'the chain does not end with the note');
          for (let i = 1; i < long.length; i++) {
            const prev = long[i - 1];
            const here = long[i];
            check(
              here.start < prev.start + prev.length - 0.001,
              `pass ${i} starts after the one before it ended — that is a gap, not a crossfade`,
            );
            check(here.start > prev.start + 0.2, `pass ${i} does not advance`);
            check(here.from > 0.2, 'a later pass starts at the attack of the take');
            // The incoming fade may be shorter than the outgoing one (a short final
            // pass), but never longer: that would leave the note thin at the join.
            check(here.fadeIn <= prev.fadeOut + 1e-9, 'the crossfade into a pass is longer than out of it');
          }
          check(long[0].fadeIn <= 0.005, 'the first pass lost its attack');

          // A note that fits inside its take is a single pass, unchanged.
          const one = loopPasses({ at: 0, want: 0.5, offset: 0, rate: 1, loopStart: 0.34, loopEnd: 1.66 });
          check(one.length === 1, `a short note was split into ${one.length} passes`);

          // A take played a little slower needs a touch more chain, not a gap.
          const slow = loopPasses({ at: 0, want: 4, offset: 0, rate: 0.94, loopStart: 0.34, loopEnd: 1.66 });
          const slowLast = slow[slow.length - 1];
          check(Math.abs(slowLast.start + slowLast.length - 4) < 0.02, 'a slowed take does not reach the end');
        }

        /* ── the derived loud and soft layers ───────────────────────── */

        const levels = Object.keys(LEVEL_GAIN);
        log.push(`levels: ${levels.map((l) => `${l} ×${LEVEL_GAIN[l]}`).join(' · ')}`);
        for (const level of levels) {
          if (!(LEVEL_TILT[level].gain > 0)) problems.push(`level ${level} has no gain`);
        }
        const order = ['p', 'mp', 'mf', 'f', 'ff'];
        for (let i = 1; i < order.length; i++) {
          if (!(LEVEL_GAIN[order[i]] > LEVEL_GAIN[order[i - 1]])) {
            problems.push(`${order[i]} is not louder than ${order[i - 1]}`);
          }
        }
        check(LEVEL_GAIN.mf === 1, 'mezzo-forte should be the recorded level, ×1');
        // The soft layer has to be darker, the loud one brighter — that tilt is
        // the whole reason the derived layers are not just quieter takes.
        check(Boolean(LEVEL_TILT.p.lowpass && LEVEL_TILT.p.lowpass < 3000), 'the soft layer has no low-pass to darken it');
        check((LEVEL_TILT.f.highShelf || 0) > 0, 'the loud layer is not brightened');
      }

      document.getElementById('report').textContent = problems.length
        ? `${problems.length} problems\n\n${[...new Set(problems)].join('\n')}\n\n${log.join('\n')}`
        : `SAMPLER OK\n${log.join('\n')}`;
      document.title = problems.length ? `SAMPLER: ${problems.length} problems` : 'SAMPLER OK';

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'sampler', problems: [...new Set(problems)], log: log.join('\n') }),
      });
    </script>
  </body>
</html>
