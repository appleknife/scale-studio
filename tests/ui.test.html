<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UI smoke test</title>
    <style>
      iframe {
        width: 1100px;
        height: 900px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- The language is pinned: this test looks for English labels, and a
         previous run on the same origin may have left Chinese in localStorage. -->
    <iframe id="f" src="/index.html?lang=en"></iframe>
    <script>
      const problems = [];
      const log = [];
      const f = document.getElementById('f');
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      f.addEventListener('load', async () => {
        const w = f.contentWindow;
        const d = f.contentDocument;
        w.addEventListener('error', (event) => problems.push(`runtime: ${event.message}`));
        w.addEventListener('unhandledrejection', (event) =>
          problems.push(`rejected: ${event.reason && (event.reason.stack || event.reason)}`),
        );

        const $ = (sel) => d.querySelector(sel);
        const view = (name) => !d.getElementById(`view-${name}`).hidden;
        const pickN = (n) => {
          for (let i = 0; i < n; i++) {
            const chips = [...d.querySelectorAll('#pickGrid .pick-chip')];
            chips[i].click();
          }
        };

        try {
          await wait(900);

          /* ── the chooser ─────────────────────────────────────────── */
          log.push(`major cards: ${d.querySelectorAll('#scaleGrid .key-card').length}`);
          if (d.querySelectorAll('#scaleGrid .key-card').length !== 12)
            problems.push('expected 12 major cards');
          if (d.querySelector('#levelTabs [data-level="5-6"]').getAttribute('aria-selected') !== 'true')
            problems.push('V–VI is not the default level');

          /* ── minor tab + forms ───────────────────────────────────── */
          d.querySelector('#modeTabs [data-mode="minor"]').click();
          log.push(`minor cards: ${d.querySelectorAll('#scaleGrid .key-card').length}`);
          if (d.querySelectorAll('#scaleGrid .key-card').length !== 12) problems.push('minor cards');
          if (d.getElementById('formTabs').hidden) problems.push('form tabs hidden on minor');
          if (!d.getElementById('levelRow').hidden) problems.push('the level row is shown on minor');

          d.querySelector('#formTabs [data-form="harmonic"]').click();
          d.querySelector('#scaleGrid .key-card').click();
          if (!view('practice')) problems.push('practice view not shown');
          log.push(`title: ${d.getElementById('scaleTitle').textContent}`);
          if (!/harmonic minor/.test(d.getElementById('scaleTitle').textContent))
            problems.push('wrong title for minor scale');
          if (d.querySelectorAll('#staffHost ellipse').length !== 29)
            problems.push('minor staff does not show 29 notes');

          /* ── spelling switch on an enharmonic major scale ────────── */
          d.getElementById('backBtn').click();
          d.querySelector('#modeTabs [data-mode="major"]').click();
          d.querySelector('#scaleGrid .key-card[data-id="F#"]').click();
          const spell = d.querySelectorAll('#spellingRow button');
          log.push(`spellings: ${[...spell].map((b) => b.textContent).join(' / ')}`);
          if (spell.length !== 2) problems.push('spelling toggle missing');
          spell[1].click();
          log.push(`switched title: ${d.getElementById('scaleTitle').textContent}`);
          if (!/major/.test(d.getElementById('scaleTitle').textContent))
            problems.push('title broken after spelling switch');
          // accidentals are drawn as paths now (text glyphs sat on a baseline
          // nobody controls), one outline each, so G-flat's six flats are six paths
          if (d.querySelectorAll('#staffHost .staff-key-sig path').length !== 6)
            problems.push('key signature missing after switch');

          /* ── octave toggle ───────────────────────────────────────── */
          d.querySelector('#octaveTabs [data-oct="1"]').click();
          if (d.querySelectorAll('#staffHost ellipse').length !== 15)
            problems.push('one-octave staff should have 15 notes');
          d.querySelector('#octaveTabs [data-oct="2"]').click();
          if (d.querySelectorAll('#staffHost ellipse').length !== 29)
            problems.push('two-octave staff should have 29 notes');

          /* ── help dialog ─────────────────────────────────────────── */
          d.getElementById('helpBtn').click();
          if (!d.getElementById('helpDialog').open) problems.push('help dialog did not open');
          d.getElementById('closeHelp').click();
          if (d.getElementById('helpDialog').open) problems.push('help dialog did not close');

          /* ── the tuner ───────────────────────────────────────────── */
          d.getElementById('tuneBtn').click();
          if (!view('tune')) problems.push('tuner view not shown');
          if (!d.querySelector('#dialHost svg .dial-needle')) problems.push('tuning dial missing');
          log.push(`string chips: ${d.querySelectorAll('#tuneStrings .string-chip').length}`);
          if (d.querySelectorAll('#tuneStrings .string-chip').length !== 4)
            problems.push('tuner should list four strings');
          if (d.querySelectorAll('#pairRows .pair').length !== 3)
            problems.push('tuner should list three fifths');
          d.getElementById('tuneBack').click();
          if (!view('choose')) problems.push('tuner back did not return home');

          /* ── V–VI: the draw ──────────────────────────────────────── */
          d.getElementById('brandHome').click();
          if (!view('choose')) problems.push('brand click did not return home');

          d.getElementById('drawBtn').click();
          if (!view('test-draw')) problems.push('draw view not shown');
          if (d.querySelectorAll('#reels .reel').length !== 3) problems.push('expected 3 reels');
          if (!d.getElementById('beginBtn').disabled) problems.push('begin enabled before the reels land');

          await wait(2600);

          const drawn = [...d.querySelectorAll('#reels .reel')].map(
            (reel) => reel.querySelector('.reel-track span:last-child').textContent,
          );
          log.push(`V–VI drawn: ${drawn.join(' | ')}`);
          if (new Set(drawn).size !== 3) problems.push(`drawn scales repeat: ${drawn.join(',')}`);
          const forbidden = ['C♭', 'G♭', 'D♭'];
          if (drawn.some((n) => forbidden.includes(n)))
            problems.push(`rare enharmonic spelling drawn: ${drawn.join(',')}`);
          if (d.getElementById('beginBtn').disabled) problems.push('begin still disabled after the spin');
          if (d.querySelectorAll('#reels .reel.is-landed').length !== 3) problems.push('reels did not land');

          /* ── I–II: choose three, one octave ──────────────────────── */
          d.getElementById('drawBack').click();
          d.querySelector('#levelTabs [data-level="1-2"]').click();
          log.push(`I–II button: ${d.getElementById('drawBtn').textContent}`);
          if (!/Level I–II/.test(d.getElementById('gridNote').textContent))
            problems.push('grid note not updated for Level I–II');

          d.getElementById('drawBtn').click();
          if (!view('test-pick')) problems.push('picker view not shown for I–II');
          if (d.querySelectorAll('#pickGrid .pick-chip').length !== 12) problems.push('picker chips');
          if (!d.getElementById('pickContinue').disabled) problems.push('continue enabled before picking');

          pickN(3);
          log.push(`I–II count: ${d.getElementById('pickCount').textContent}`);
          if (d.getElementById('pickContinue').disabled) problems.push('continue still disabled at 3 picks');

          d.getElementById('pickContinue').click();
          if (!view('test-draw')) problems.push('I–II did not reach the draw screen');
          const oneOct = [...d.querySelectorAll('#reels .reel-sig')].map((s) => s.textContent);
          log.push(`I–II reels: ${oneOct.join(' | ')}`);
          if (!oneOct.every((t) => t.includes('1 oct')))
            problems.push(`I–II reels are not all one octave: ${oneOct.join(',')}`);

          /* ── III–IV: choose seven, two of them two octaves ───────── */
          d.getElementById('drawBack').click();
          d.querySelector('#levelTabs [data-level="3-4"]').click();
          d.getElementById('drawBtn').click();
          if (!view('test-pick')) problems.push('picker view not shown for III–IV');
          pickN(7);
          log.push(`III–IV count: ${d.getElementById('pickCount').textContent}`);
          if (d.getElementById('twoOctPanel').hidden)
            problems.push('two-octave panel missing at seven picks');
          if (d.querySelectorAll('#twoOctRow button[aria-pressed="true"]').length !== 2)
            problems.push('two-octave chips not pre-marked');
          if (d.getElementById('pickContinue').disabled) problems.push('continue disabled at seven picks');

          d.getElementById('pickContinue').click();
          await wait(2600);
          const mixed = [...d.querySelectorAll('#reels .reel-sig')].map((s) => s.textContent);
          log.push(`III–IV reels: ${mixed.join(' | ')}`);
          if (mixed.filter((t) => t.includes('2 oct')).length !== 1)
            problems.push(`III–IV should play exactly one two-octave scale: ${mixed.join(',')}`);
          if (mixed.filter((t) => t.includes('1 oct')).length !== 2)
            problems.push(`III–IV should play two one-octave scales: ${mixed.join(',')}`);

          /* ── Changing the level from inside the audition ──────────── */
          // The level used to be reachable only by going into Scales and backing
          // out. It now sits on the picker and on the draw, and changing it moves
          // the audition to that level's own flow.
          const markedIn = (row) =>
            [...d.querySelectorAll(`#${row} button[data-level]`)]
              .filter((b) => b.getAttribute('aria-selected') === 'true')
              .map((b) => b.dataset.level);
          if (d.querySelectorAll('#drawLevels button').length !== 3)
            problems.push('the draw screen has no level row');
          if (markedIn('drawLevels').join() !== '3-4')
            problems.push(`the draw's level row shows ${markedIn('drawLevels').join() || 'nothing'}`);

          d.querySelector('#drawLevels [data-level="1-2"]').click();
          await wait(200);
          log.push(`level row on the draw → I–II lands on: ${['test-pick', 'test-draw'].filter(view).join()}`);
          if (!view('test-pick')) problems.push('changing to I–II on the draw did not reach the picker');
          if (markedIn('pickLevels').join() !== '1-2')
            problems.push(`the picker's level row shows ${markedIn('pickLevels').join() || 'nothing'}`);
          if (markedIn('levelTabs').join() !== '1-2')
            problems.push('the scales screen kept the old level');
          if (!/Choose three scales/.test(d.getElementById('pickTitle').textContent))
            problems.push('the picker still asks for seven scales');
          if (d.querySelectorAll('#pickGrid .pick-chip[aria-pressed="true"]').length !== 0)
            problems.push('the old seven stayed picked after the level changed');
          if (!d.getElementById('pickContinue').disabled)
            problems.push('continue was live on an empty pick after the level changed');

          // And back the other way: a picker at I–II moved to V–VI is a draw.
          d.querySelector('#pickLevels [data-level="5-6"]').click();
          await wait(2600);
          if (!view('test-draw')) problems.push('changing to V–VI on the picker did not draw');
          if (markedIn('drawLevels').join() !== '5-6')
            problems.push(`the re-drawn screen shows ${markedIn('drawLevels').join() || 'nothing'}`);
          const redrawn = [...d.querySelectorAll('#reels .reel-sig')].map((s) => s.textContent);
          log.push(`level row on the picker → V–VI reels: ${redrawn.join(' | ')}`);
          if (!redrawn.every((t) => t.includes('2 oct')))
            problems.push(`a V–VI draw came out at the wrong octaves: ${redrawn.join(',')}`);
          if (d.getElementById('beginBtn').disabled) problems.push('the re-draw never finished landing');

          /* ── the practice log: a copy out, and a copy back in ────── */
          d.getElementById('openLogBtn').click();
          await wait(200);
          if (!view('track')) problems.push('log view not shown');

          // A download opens a save dialog that would hang a headless run, so the
          // anchor's own click is intercepted. Everything before the browser's
          // dialog still runs for real: the blob, the name, the message.
          const anchorClick = w.HTMLAnchorElement.prototype.click;
          let offered = '';
          w.HTMLAnchorElement.prototype.click = function () {
            offered = this.download;
          };
          d.getElementById('exportLog').click();
          await wait(150);
          w.HTMLAnchorElement.prototype.click = anchorClick;
          const saved = d.getElementById('logStatus').textContent;
          log.push(`export: ${saved} · ${offered}`);
          if (!/Saved \d+ days/.test(saved)) problems.push('save a copy said nothing useful');
          if (!/^scale-studio-practice-log-\d{4}-\d{2}-\d{2}\.json$/.test(offered))
            problems.push(`the copy is not named usefully: ${offered}`);

          // Loading is checked only as far as its wiring goes. The file itself is
          // read asynchronously, and a headless run under a virtual clock races
          // its timers ahead of blob I/O — the read sometimes lands after the
          // budget is spent, which says nothing about the app. The rules the read
          // feeds (parse, merge, ready) are covered exactly in journal.test.html.
          const picker = d.getElementById('importFile');
          let opened = false;
          picker.click = () => {
            opened = true;
          };
          d.getElementById('importLog').click();
          log.push(`load a copy opens the picker: ${opened}`);
          if (!opened) problems.push('load a copy does not open the file picker');
          if (!picker.accept.includes('json')) problems.push('the picker does not ask for json');

          /* ── three children, one tablet ─────────────────────────── */
          // Give the first log a day, so the next name has to become a second log
          // instead of taking over an empty one.
          d.querySelector('#todayChips [data-tag="scales"]').click();
          await wait(120);
          const namesOf = () => [...d.querySelectorAll('#whoChips [data-who]')];
          log.push(`names: ${namesOf().map((c) => c.textContent).join(', ')}`);
          if (namesOf().length !== 1) problems.push('a fresh device should hold one log');
          if (d.getElementById('streakNum').textContent !== '1') problems.push('today was not logged');

          d.querySelector('#whoChips [data-who-add]').click();
          if (d.getElementById('nameForm').hidden) problems.push('add a name did not open the form');
          d.getElementById('nameInput').value = 'Maya';
          d.getElementById('nameForm').dispatchEvent(
            new w.Event('submit', { bubbles: true, cancelable: true }),
          );
          await wait(150);
          log.push(`names: ${namesOf().map((c) => c.textContent).join(', ')}`);
          if (namesOf().length !== 2) problems.push('a second name did not make a second log');
          if (!d.getElementById('nameForm').hidden) problems.push('the name form stayed open');
          if (d.getElementById('streakNum').textContent !== '0')
            problems.push('a new name inherited the first log');
          if (!d.getElementById('lessonSheet').textContent.includes('Maya'))
            problems.push('the lesson sheet does not say whose week it is');

          // And back: the first log still has its day.
          namesOf()[0].click();
          await wait(150);
          if (d.getElementById('streakNum').textContent !== '1')
            problems.push('switching back lost the first log');
          if (d.getElementById('lessonSheet').textContent.includes('Maya'))
            problems.push('the lesson sheet still says Maya after switching away');

          /* ── whose log, before anything personal shows ──────────── */
          // On a shared tablet the name should be answerable from the home screen.
          // The old way made a sibling open the log — and so see the other child's
          // week — just to find their own name.
          const home = () => [...d.querySelectorAll('#homeWhoChips [data-who]')];
          const backHome = d.getElementById('trackBack');
          backHome.click();
          await wait(200);
          log.push(`home names: ${home().map((c) => c.textContent).join(', ')}`);
          if (d.getElementById('homeWho').hidden) problems.push('the home screen has no name row');
          if (home().length !== 2) problems.push(`expected 2 names on the home screen, saw ${home().length}`);
          const pressed = home().filter((c) => c.getAttribute('aria-pressed') === 'true');
          if (pressed.length !== 1) problems.push('exactly one name should be marked active');

          // Switching from the home screen has to take effect everywhere: the
          // banner, and the log when it is next opened.
          home()[1].click();
          await wait(200);
          if (!d.getElementById('logBannerText').textContent.includes('Maya'))
            problems.push('switching on the home screen did not change the banner');
          d.getElementById('openLogBtn').click();
          await wait(200);
          if (!namesOf()[1].getAttribute('aria-pressed') === 'true')
            problems.push('the log did not follow the home switch');
          if (!d.getElementById('lessonSheet').textContent.includes('Maya'))
            problems.push('the lesson sheet did not follow the home switch');
          backHome.click();
          await wait(150);

          /* ── your stats ───────────────────────────────────────── */
          // The screen has to open from the home card, switch tabs, re-sort, and
          // say what it is *not* counting. The numbers themselves are the journal
          // suite's job; this is the wiring.
          d.getElementById('openStatsBtn').click();
          await wait(250);
          if (!view('stats')) problems.push('the stats card did not open the stats screen');
          const tiles = () => [...d.querySelectorAll('#statsSummary .stat-tile')];
          log.push(`stat tiles: ${tiles().length} · tab ${d.querySelector('#statTabs [aria-selected="true"]').dataset.statTab}`);
          if (tiles().length !== 5) problems.push(`expected five summary tiles, saw ${tiles().length}`);
          if (d.querySelector('#statTabs [aria-selected="true"]').dataset.statTab !== 'scale')
            problems.push('the stats screen should open on the scales tab');

          // With no takes yet, each tab says so rather than showing an empty table.
          if (!d.querySelector('#statPanel .stat-empty')) problems.push('an empty stats screen shows no explanation');

          d.querySelector('#statTabs [data-stat-tab="sight"]').click();
          await wait(120);
          if (d.querySelector('#statTabs [aria-selected="true"]').dataset.statTab !== 'sight')
            problems.push('the sight-reading tab did not switch');
          d.querySelector('#statSort [data-stat-sort="best"]').click();
          await wait(120);
          if (d.querySelector('#statSort [aria-selected="true"]').dataset.statSort !== 'best')
            problems.push('the sort control did not switch');
          d.getElementById('statsBack').click();
          await wait(150);

          /* ── sight reading: picking a bar, and slow practice ────── */
          // The example can start from a bar the reader taps, so the engraver's
          // boxes have to be there, clickable, and marked in exactly one place —
          // and the button has to say what it will now do.
          d.getElementById('openSightBtn').click();
          await wait(450);
          const boxes = () => [...d.querySelectorAll('#sightStaff .score-bar-box')];
          const picked = () => boxes().filter((b) => b.classList.contains('is-picked'));
          log.push(`bar boxes: ${boxes().length}`);
          if (boxes().length !== 8) problems.push(`expected 8 bar boxes, saw ${boxes().length}`);
          if (boxes().length !== new Set(boxes().map((b) => b.dataset.bar)).size)
            problems.push('two bar boxes claim the same bar');

          const hear = d.getElementById('sightHearBtn');
          if (hear.textContent.trim() !== 'Hear the passage')
            problems.push(`the hear button reads "${hear.textContent.trim()}" before a pick`);

          boxes()[2].dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
          await wait(120);
          if (picked().length !== 1) problems.push('tapping a bar did not mark one bar');
          if (picked()[0] && picked()[0].dataset.bar !== '2')
            problems.push(`the wrong bar was marked (${picked()[0].dataset.bar})`);
          log.push(`hear button with bar 3 picked: "${hear.textContent.trim()}"`);
          if (hear.textContent.trim() !== 'Start at bar 3')
            problems.push(`the hear button reads "${hear.textContent.trim()}" with a bar picked`);

          // The same bar again lets it go. A student who taps the wrong bar must
          // not be stuck with it.
          boxes()[2].dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
          await wait(120);
          if (picked().length !== 0) problems.push('tapping the marked bar did not clear it');
          if (hear.textContent.trim() !== 'Hear the passage')
            problems.push('the hear button kept the pick after it was cleared');

          // A new passage must not carry a bar number over.
          boxes()[4].dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
          await wait(80);
          d.getElementById('sightNewBtn').click();
          await wait(350);
          if (picked().length !== 0) problems.push('a new passage kept the old bar marked');
          if (hear.textContent.trim() !== 'Hear the passage')
            problems.push('a new passage kept "start at bar" on the button');

          // Slow practice: three speeds, one marked, and choosing one moves the
          // mark without opening the audio path (this test never plays).
          const speeds = [...d.querySelectorAll('#sightSpeeds button')];
          log.push(`speeds: ${speeds.map((b) => b.dataset.rate).join('/')}`);
          if (speeds.length !== 3) problems.push(`expected 3 speeds, saw ${speeds.length}`);
          if (speeds.filter((b) => b.getAttribute('aria-selected') === 'true').length !== 1)
            problems.push('exactly one speed should be selected');
          // The printed marking is the default: a student hears what the page
          // says, and drops to ½ or ¾ themselves if a level VI excerpt is a
          // stretch. Half was the default for one build and the teacher asked for
          // the marking back.
          if (speeds[speeds.length - 1].getAttribute('aria-selected') !== 'true')
            problems.push('the passage should start at the printed tempo');
          if (speeds[speeds.length - 1].dataset.rate !== '1')
            problems.push('the selected speed is not the printed one');
          if (speeds[speeds.length - 1].textContent.trim() !== 'NYSSMA tempo')
            problems.push('the printed tempo is not labelled as NYSSMA’s');
          if (speeds[0].dataset.rate !== '0.5') problems.push('the first speed is not ½');
          speeds[0].click();
          await wait(80);
          if (speeds[0].getAttribute('aria-selected') !== 'true')
            problems.push('choosing half speed did not mark it');
          if (speeds.some((b) => b !== speeds[0] && b.getAttribute('aria-selected') === 'true'))
            problems.push('two speeds are marked at once');

          // The switch is test mode now — unticked by default, and ticking it is
          // what turns the clicks and the line off.
          const assist = d.getElementById('sightAssist');
          if (assist.checked) problems.push('test mode should be off by default');
          if (!/test/i.test(assist.parentElement.textContent))
            problems.push('the switch is not labelled as test mode');
        } catch (err) {
          problems.push('exception: ' + err.message + ' @ ' + (err.stack || '').split('\n')[1]);
        }

        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'ui', problems, log: log.join('\n') }, null, 2),
        });
      });
    </script>
  </body>
</html>
