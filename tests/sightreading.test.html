<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sight-reading generator test</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      h2 { font-size: 15px; margin: 22px 0 6px; letter-spacing: 0.06em; text-transform: uppercase; color: #8b8277; }
      pre { background: #fffdfa; border: 1px solid #e8dfd1; padding: 12px; overflow: auto; }
      .score { width: 100%; max-width: 900px; display: block; margin: 4px 0 10px; }
      .score text { font-family: "Iowan Old Style", Palatino, Georgia, serif; fill: #221e19; }
      .score-tempo { fill: #4d463e; }
      .score-time { font-weight: 600; }
      .ok { color: #0a7a3d; font-weight: 700; }
      .bad { color: #a3231c; font-weight: 700; }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <div id="gallery"></div>
    <script>
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      import { generatePassage, flatten, SIGHT_LEVELS, levelSpec } from '../src/sightreading.js';
      import { renderScore } from '../src/score.js';
      import { MAJOR_KEYS, makeNote } from '../src/music.js';

      const problems = [];
      const log = [];

      /** Duration codes are sixteenths; names make a failure readable. */
      const DUR = {
        1: 'a sixteenth',
        2: 'an eighth',
        3: 'a dotted eighth',
        4: 'a quarter',
        6: 'a dotted quarter',
        8: 'a half',
        12: 'a dotted half',
        16: 'a whole',
      };

      const tonicClass = (keyId) => {
        const card = MAJOR_KEYS.find((k) => k.id === keyId);
        const v = card.variants[0];
        return makeNote(v.letter, v.alter, 4).midi % 12;
      };

      

      let checked = 0;
      for (const level of SIGHT_LEVELS) {
        const spec = levelSpec(level);
        for (let seed = 0; seed < 120; seed++) {
          const p = generatePassage({ level, seed });
          checked++;
          const id = `L${level} seed ${seed}`;
          if (!p) {
            problems.push(`${id}: generator returned nothing`);
            continue;
          }

          if (p.bars.length !== 8) problems.push(`${id}: ${p.bars.length} bars`);

          p.bars.forEach((events, i) => {
            const total = events.reduce((a, e) => a + e.dur, 0);
            if (Math.abs(total - p.perBar) > 0.01) problems.push(`${id}: bar ${i + 1} adds to ${total}, not ${p.perBar}`);
            if (!events.length) problems.push(`${id}: bar ${i + 1} is empty`);
          });

          const sounding = flatten(p).filter((e) => !e.rest && e.note);
          if (sounding.length < 12) problems.push(`${id}: only ${sounding.length} notes`);

          for (const e of sounding) {
            if (e.midi < spec.range[0] || e.midi > spec.range[1]) {
              problems.push(`${id}: ${e.note.name} outside ${spec.range.join('–')}`);
            }
            if (Math.abs(e.note.alter) > 1) problems.push(`${id}: unprintable accidental ${e.note.name}`);
          }

          // cadence on the tonic
          const last = sounding[sounding.length - 1];
          if (last.midi % 12 !== tonicClass(p.key.id)) {
            problems.push(`${id}: ends on ${last.note.name}, not the tonic`);
          }

          // opening on a chord tone
          const first = sounding[0];
          const t = tonicClass(p.key.id);
          const chord = [(t + 0) % 12, (t + 4) % 12, (t + 7) % 12];
          if (!chord.includes(first.midi % 12)) {
            problems.push(`${id}: opens on ${first.note.name}, not a chord tone`);
          }

          // intervals stay inside the level's vocabulary
          for (let i = 1; i < sounding.length; i++) {
            const interval = Math.abs(sounding[i].midi - sounding[i - 1].midi);
            if (interval > spec.maxSemis) {
              problems.push(
                `${id}: ${sounding[i - 1].note.name}→${sounding[i].note.name} is ${interval} semitones, limit ${spec.maxSemis}`,
              );
            }
          }

          // keys and meters come from the level's list
          if (!spec.keys.includes(p.key.id)) problems.push(`${id}: key ${p.key.id} not in the level`);
          if (!spec.meters.includes(p.meter)) problems.push(`${id}: meter ${p.meter} not in the level`);

          // slurs pair up inside one bar: start, then end, never two at once
          for (const barEvents of p.bars) {
            let open = false;
            for (const e of barEvents) {
              if (e.slurStart) {
                if (open) problems.push(`${id}: two slurs open at once`);
                open = true;
              }
              if (e.slurEnd) {
                if (!open) problems.push(`${id}: a slur ends without starting`);
                open = false;
              }
            }
            if (open) problems.push(`${id}: a slur never closes`);
          }

          // Level I is D major, one octave, quarter notes and slower, no rests —
          // the Manual's page for level I has nothing else on it.
          if (level === 1) {
            if (p.key.id !== 'D') problems.push(`${id}: key ${p.key.id} at level 1`);
            for (const e of flatten(p)) {
              if (e.rest) problems.push(`${id}: a rest at level 1`);
              else if (![4, 8, 16].includes(e.dur)) {
                problems.push(`${id}: ${DUR[e.dur] || e.dur} at level 1`);
              }
            }
          }
        }

        // determinism
        const a = JSON.stringify(generatePassage({ level, seed: 4471 }));
        const b = JSON.stringify(generatePassage({ level, seed: 4471 }));
        if (a !== b) problems.push(`L${level}: seed 4471 is not reproducible`);
      }

      log.push(`passages generated: ${checked}`);

      // The tempo each level prints, as the Manual gives it. Three of these have
      // been corrected from the printed page, so the table is pinned here: an
      // accidental edit should fail the suite rather than ship.
      const TEMPO = {
        '1:*': ['q', 60],
        '2:*': ['q', 72],
        '3:*': ['q', 80],
        '4:2/2': ['h', 76],
        '4:*': ['q', 88],
        // V and VI print only what changes; everything else carries over at 88,
        // which is the point of the rule — a later level never slows down.
        '5:2/2': ['h', 76],
        '5:6/8': ['qd', 60],
        '5:*': ['q', 88],
        '6:2/2': ['h', 76],
        '6:4/4': ['q', 120],
        '6:6/8': ['qd', 72],
        '6:*': ['q', 88],
      };
      for (const level of SIGHT_LEVELS) {
        for (let seed = 0; seed < 40; seed++) {
          const p = generatePassage({ level, seed });
          const want = TEMPO[`${level}:${p.meter}`] || TEMPO[`${level}:*`];
          if (!want) continue;
          if (p.tempo.unit !== want[0] || p.tempo.bpm !== want[1]) {
            problems.push(
              `L${level} ${p.meter}: marked ${p.tempo.unit}=${p.tempo.bpm}, expected ${want[0]}=${want[1]}`,
            );
          }
        }
      }

      // Level I should actually use all three note values, not just quarters.
      {
        const counts = {};
        for (let seed = 0; seed < 120; seed++) {
          for (const e of flatten(generatePassage({ level: 1, seed }))) {
            counts[e.dur] = (counts[e.dur] || 0) + 1;
          }
        }
        const total = Object.values(counts).reduce((a, b) => a + b, 0);
        log.push(
          'L1 note values: ' +
            Object.entries(counts)
              .sort((a, b) => b[1] - a[1])
              .map(([d, n]) => `${DUR[d] || d} ${Math.round((n / total) * 100)}%`)
              .join(' · '),
        );
      }

      // Level II's page has slurred pairs and dotted halves. Both are easy to lose
      // behind a level gate or a missing rhythm pattern, so count them for real.
      {
        let slurred = 0;
        let dotted = 0;
        for (let seed = 0; seed < 80; seed++) {
          const evs = flatten(generatePassage({ level: 2, seed }));
          if (evs.some((e) => e.slurStart)) slurred++;
          if (evs.some((e) => e.dur === 12)) dotted++;
        }
        log.push(`L2: slurs in ${slurred}/80 passages · dotted halves in ${dotted}/80`);
        if (slurred < 20) problems.push(`level 2 slurred only ${slurred} of 80 passages`);
        if (dotted < 5) problems.push(`level 2 used a dotted half in only ${dotted} of 80 passages`);
      }

      // Where does the music actually sit? A passage can obey every rule and still
      // live on ledger lines, so this is reported per level rather than asserted.
      for (const level of SIGHT_LEVELS) {
        const firsts = [];
        const tops = [];
        const all = [];
        for (let seed = 0; seed < 60; seed++) {
          const p = generatePassage({ level, seed });
          const notes = flatten(p).filter((e) => e.note).map((e) => e.midi);
          firsts.push(notes[0]);
          tops.push(Math.max(...notes));
          all.push(...notes);
        }
        const med = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];
        log.push(
          `L${level}: opens ~${med(firsts)} · peak ~${med(tops)} · range ${Math.min(...all)}–${Math.max(...all)}`,
        );
      }

      // a spread of seeds per level, for the eye
      const gallery = document.getElementById('gallery');
      for (const level of SIGHT_LEVELS) {
        const p = generatePassage({ level, seed: 4471 + level * 13 });
        const unit = { e: '\u266A', q: '\u2669', h: '\u{1D15E}', qd: '\u2669.' }[p.tempo.unit] || '\u2669';
        const h = document.createElement('h2');
        h.textContent = `Level ${level} — ${p.key.name} major, ${p.meter}, ${p.tempo.bpm} bpm, seed ${p.seed}`;
        gallery.append(h);
        const wrap = document.createElement('div');
        wrap.innerHTML = renderScore(p, { tempoText: `${unit} = ${p.tempo.bpm}` });
        gallery.append(wrap);
      }

      const report = document.getElementById('report');
      report.innerHTML =
        (problems.length ? `<span class="bad">${problems.length} problems</span>` : '<span class="ok">all invariants hold</span>') +
        '\n\n' +
        [...new Set(problems)].slice(0, 25).join('\n') +
        '\n\n' +
        log.join('\n');

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'sightreading', problems: [...new Set(problems)].slice(0, 40), log: log.join('\n') }),
      });
    </script>
  </body>
</html>
