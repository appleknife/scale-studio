<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notation collisions</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      pre {
        background: #fffdfa;
        border: 1px solid #e8dfd1;
        padding: 12px;
        white-space: pre-wrap;
      }
      /* Rendered off-screen: getBBox needs the SVG to be in the document. */
      #stage {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1000px;
      }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <div id="stage"></div>
    <script>
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      // Nothing on a page of music may sit on top of anything else. Two places
      // this kept happening: a rest pushed into the flag of the note before it,
      // and a slur cutting through a stem it passes over. Both are measured here
      // rather than eyeballed, because a spot fix is how they come back.
      import { generatePassage, SIGHT_LEVELS } from '../src/sightreading.js';
      import { renderScore } from '../src/score.js';

      const stage = document.getElementById('stage');
      const problems = [];
      const log = [];
      const SEEDS = 60;
      // Ink that comes within two units counts: at reading size, glyphs a unit
      // apart look like one mark, and that is exactly what a student misreads.
      const AIR = 2;

      const box = (node) => {
        const b = node.getBBox();
        return { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
      };
      /**
       * Where a dynamic's letters actually are. `getBBox` on a `<text>` reports the
       * whole em box — 21 units for 19 px type, while "mf" occupies about 13 — and
       * compared with the note head it sits under that reports a collision in a
       * third of all passages. The letters of a dynamic run from about 0.74 of the
       * type size above the baseline to a little below it ('p' in "mp" is the only
       * descender), so that band is what is measured. `getExtentOfChar` is no help:
       * Chrome returns the em box for it too.
       */
      const dynBox = (node) => {
        const b = box(node);
        const baseline = Number(node.getAttribute('y'));
        const size = Number(node.getAttribute('font-size')) || 19;
        return { x0: b.x0, x1: b.x1, y0: baseline - size * 0.74, y1: baseline + size * 0.16 };
      };

      /**
       * Does `node`'s ink reach into `rect`? A small glyph is measured by its
       * box; a wide one — which on this page means a beam — by walking its
       * outline, because a slanted beam's box is a tall rectangle and a mark
       * printed below the beam is inside that rectangle without being anywhere
       * near the ink.
       */
      const touches = (node, rect) => {
        const b = box(node);
        if (!overlap(rect, b, 0)) return false; // cheap, and true of almost every glyph
        if (b.x1 - b.x0 <= 20) return true;
        const len = node.getTotalLength ? node.getTotalLength() : 0;
        if (!len) return overlap(rect, b, 0);
        for (let i = 0; i <= 48; i++) {
          const pt = node.getPointAtLength((i / 48) * len);
          if (pt.x > rect.x0 && pt.x < rect.x1 && pt.y > rect.y0 && pt.y < rect.y1) return true;
        }
        return false;
      };

      /** True when `b` is inside `air` of `a`, on both axes. */
      const overlap = (a, b, air = AIR) =>
        Math.min(a.x1 + air, b.x1) - Math.max(a.x0 - air, b.x0) > 0 &&
        Math.min(a.y1 + air, b.y1) - Math.max(a.y0 - air, b.y0) > 0;

      /** A point has no extent, so it needs its own test, not `overlap`. */
      const inside = (pt, b) => pt.x > b.x0 && pt.x < b.x1 && pt.y > b.y0 && pt.y < b.y1;

      /**
       * The `M … C …` a slur is drawn with, sampled into points — half a unit
       * apart, because a stem is only about two units wide and a coarser walk
       * steps straight over it.
       */
      function slurPoints(node) {
        const nums = (node.getAttribute('d').match(/-?\d+(\.\d+)?/g) || []).map(Number);
        if (nums.length < 8) return [];
        const [x1, y1, c1x, c1y, c2x, c2y, x2, y2] = nums;
        const span = Math.hypot(x2 - x1, y2 - y1) + Math.hypot(c1x - x1, c1y - y1);
        const count = Math.max(64, Math.ceil(span / 0.5));
        const pts = [];
        for (let i = 0; i <= count; i++) {
          const t = i / count;
          const u = 1 - t;
          pts.push({
            x: u * u * u * x1 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x2,
            y: u * u * u * y1 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y2,
            t,
          });
        }
        return pts;
      }

      // A note's own head: the ellipse it is drawn on. Both are measured, not
      // guessed — the flag is the only path about 11 wide and 35 tall, and the
      // heads are the only ellipses.
      const isFlag = (n) => {
        const b = box(n);
        const w = b.x1 - b.x0;
        const h = b.y1 - b.y0;
        // The second flag of a lone sixteenth is drawn shorter, so the range
        // has to reach down to it; nothing else on the page is this narrow and
        // this tall (an accent is 11 × 8, a beam is far wider).
        return w > 9 && w < 13 && h > 14 && h < 38;
      };

      for (const level of SIGHT_LEVELS) {
        let rests = 0;
        let slurs = 0;
        let accidentals = 0;
        let flags = 0;
        let dynamics = 0;
        const headHits = [];
        const restHits = [];
        const slurHits = [];
        const accidentalHits = [];
        const flagHits = [];
        const dynamicHits = [];

        for (let seed = 0; seed < SEEDS; seed++) {
          const p = generatePassage({ level, seed });
          stage.innerHTML = renderScore(p, { tempoText: '\u2669 = 60' });
          const svg = stage.querySelector('svg');

          // ── rests ------------------------------------------------------
          const restBoxes = [...svg.querySelectorAll('g.score-rest')].map((n) => box(n));
          rests += restBoxes.length;

          const inkNodes = [
            ...svg.querySelectorAll('ellipse'),
            ...[...svg.querySelectorAll('path')].filter(
              (n) =>
                !n.closest('g.score-rest') &&
                !n.classList.contains('score-slur') &&
                !n.closest('g.score-acc'),
            ),
            ...[...svg.querySelectorAll('circle')].filter((n) => !n.closest('g.score-rest')),
          ];
          const ink = inkNodes.map((n) => box(n));

          for (const r of restBoxes) {
            const bad = ink.find((b) => overlap(r, b));
            if (bad) {
              restHits.push(`L${level} seed ${seed}: rest at ${r.x0.toFixed(0)} runs into ink at ${bad.x0.toFixed(0)}`);
              break;
            }
          }

          // ── flags ------------------------------------------------------
          // A flag hangs beside its stem, and on a down-stem note the head is on
          // that same side. Mirrored naively, the tail lands on the notehead and
          // the gap between stem and flag closes into a knot — which is exactly
          // what happened. A flag must therefore touch no head at all.
          const flagPaths = [...svg.querySelectorAll('path')].filter(
            (n) =>
              !n.closest('g.score-rest') &&
              !n.classList.contains('score-slur') &&
              !n.closest('g.score-acc') &&
              isFlag(n),
          );
          flags += flagPaths.length;
          // Measured on the drawing, not on bounding boxes: a flag's box nearly
          // always grazes a head's box, because the hook is 11 units wide beside
          // a head 13 wide. What matters is ink, so the flag's outline is walked
          // and tested against each head's ellipse.
          const heads = [...svg.querySelectorAll('ellipse')].map((n) => {
            const t = n.getAttribute('transform') || '';
            const m = t.match(/rotate\((-?[\d.]+)/);
            return {
              cx: Number(n.getAttribute('cx')),
              cy: Number(n.getAttribute('cy')),
              rx: Number(n.getAttribute('rx')),
              ry: Number(n.getAttribute('ry')),
              turn: m ? (-Number(m[1]) * Math.PI) / 180 : 0,
            };
          });
          const inHead = (x, y) =>
            heads.some((h) => {
              const dx = x - h.cx;
              const dy = y - h.cy;
              const ux = dx * Math.cos(h.turn) + dy * Math.sin(h.turn);
              const uy = -dx * Math.sin(h.turn) + dy * Math.cos(h.turn);
              return (ux / h.rx) ** 2 + (uy / h.ry) ** 2 < 1;
            });
          for (const f of flagPaths) {
            const len = f.getTotalLength();
            let hit = false;
            for (let i = 0; i <= 64 && !hit; i++) {
              const pt = f.getPointAtLength((i / 64) * len);
              hit = inHead(pt.x, pt.y);
            }
            if (hit) {
              const b = box(f);
              flagHits.push(`L${level} seed ${seed}: flag at ${b.x0.toFixed(0)},${b.y0.toFixed(0)} runs into a note head`);
              break;
            }
          }

          // ── heads on top of each other ---------------------------------
          // Two note heads may never touch: the line is one voice, so a pair this
          // close is either a spacing bug or a bar that overflowed onto the next
          // one's first note. Every head is the same ellipse, so two heads
          // overlap exactly when their centres are less than two radii apart in
          // the ellipse's own frame — rotate and scale, and it is a circle test.
          const headList = [...svg.querySelectorAll('ellipse')].map((n) => {
            const t = n.getAttribute('transform') || '';
            const m = t.match(/rotate\((-?[\d.]+)/);
            return {
              cx: Number(n.getAttribute('cx')),
              cy: Number(n.getAttribute('cy')),
              rx: Number(n.getAttribute('rx')),
              ry: Number(n.getAttribute('ry')),
              turn: m ? (-Number(m[1]) * Math.PI) / 180 : 0,
            };
          });
          for (let i = 0; i < headList.length; i++) {
            for (let j = i + 1; j < headList.length; j++) {
              const a = headList[i];
              const b = headList[j];
              const dx = b.cx - a.cx;
              const dy = b.cy - a.cy;
              const ux = (dx * Math.cos(a.turn) + dy * Math.sin(a.turn)) / a.rx;
              const uy = (-dx * Math.sin(a.turn) + dy * Math.cos(a.turn)) / a.ry;
              if (Math.hypot(ux, uy) < 2) {
                headHits.push(
                  `L${level} seed ${seed}: heads at ${a.cx.toFixed(0)},${a.cy.toFixed(0)} and ${b.cx.toFixed(0)},${b.cy.toFixed(0)} overlap`,
                );
                break;
              }
            }
            if (headHits.length) break;
          }

          // ── dynamics ---------------------------------------------------
          // A dynamic letter sits under the bar and an articulation hangs below
          // its note, so a low note with an accent underneath it reaches down
          // into the "f" — which is exactly what happened, once, in a passage a
          // student was given. Nothing may come within two units of either.
          const textNodes = [...svg.querySelectorAll('text.score-dyn, text.score-tempo, text.score-tuplet')];
          dynamics += textNodes.length;
          for (const node of textNodes) {
            const d = dynBox(node);
            const pad = { x0: d.x0 - AIR, y0: d.y0 - AIR, x1: d.x1 + AIR, y1: d.y1 + AIR };
            const bad = inkNodes.find((n) => touches(n, pad));
            if (bad) {
              const b = box(bad);
              dynamicHits.push(
                `L${level} seed ${seed}: ${node.getAttribute('class')} at ${d.x0.toFixed(0)},${d.y0.toFixed(0)} runs into ink at ${b.x0.toFixed(0)},${b.y0.toFixed(0)}`,
              );
              break;
            }
          }

          // ── accidentals ------------------------------------------------
          // A sharp in front of a note has to clear whatever the note before it
          // puts there — a flag sweeps a whole space right of its stem, and a dot
          // sits a step right of its head. A sign drawn through a flag is the bug
          // this measures.
          const accBoxes = [...svg.querySelectorAll('g.score-acc')].map((n) => box(n));
          accidentals += accBoxes.length;
          for (const a of accBoxes) {
            const bad = ink.find((b) => overlap(a, b));
            if (bad) {
              accidentalHits.push(
                `L${level} seed ${seed}: accidental at ${a.x0.toFixed(0)},${a.y0.toFixed(0)} runs into ink at ${bad.x0.toFixed(0)},${bad.y0.toFixed(0)}`,
              );
              break;
            }
          }

          // ── slurs ------------------------------------------------------
          // A stem is a line; a beam or a flag is a path; a head is an ellipse.
          // The slur must pass clear of all of them, its own two ends excepted.
          const solids = [
            ...[...svg.querySelectorAll('line')]
              .filter((n) => n.getAttribute('stroke-width') === '1.42')
              .map((n) => {
                const x = Number(n.getAttribute('x1'));
                const y1 = Number(n.getAttribute('y1'));
                const y2 = Number(n.getAttribute('y2'));
                return { x0: x - 0.9, x1: x + 0.9, y0: Math.min(y1, y2), y1: Math.max(y1, y2) };
              }),
            ...ink,
          ];

          for (const slur of svg.querySelectorAll('path.score-slur')) {
            slurs += 1;
            const near = solids.filter((b) => overlap(box(slur), b, 30));
            const bad = slurPoints(slur)
              .filter((pt) => pt.t > 0.06 && pt.t < 0.94)
              .find((pt) => near.find((b) => inside(pt, b)));
            if (bad) {
              slurHits.push(`L${level} seed ${seed}: slur passes through ink at ${bad.x.toFixed(0)},${bad.y.toFixed(0)}`);
              break;
            }
          }
        }

        log.push(
          `L${level}: rests ${restHits.length}/${SEEDS} broken (${rests} drawn) · ` +
            `slurs ${slurHits.length}/${SEEDS} broken (${slurs} drawn) · ` +
            `accidentals ${accidentalHits.length}/${SEEDS} broken (${accidentals} drawn) · ` +
            `flags ${flagHits.length}/${SEEDS} broken (${flags} drawn) · ` +
            `dynamics ${dynamicHits.length}/${SEEDS} broken (${dynamics} drawn) · ` +
            `heads ${headHits.length}/${SEEDS} collided`,
        );
        problems.push(
          ...headHits.slice(0, 2),
          ...restHits.slice(0, 2),
          ...slurHits.slice(0, 2),
          ...accidentalHits.slice(0, 2),
          ...flagHits.slice(0, 2),
          ...dynamicHits.slice(0, 2),
        );
      }

      document.getElementById('report').textContent = problems.length
        ? `NOTATION FAILED\n${problems.join('\n')}\n\n${log.join('\n')}`
        : `NOTATION OK\n${log.join('\n')}`;
      document.title = problems.length ? 'NOTATION FAILED' : 'NOTATION OK';

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'notation', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
