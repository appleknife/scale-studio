<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notation collisions</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      pre {
        background: #fffdfa;
        border: 1px solid #e8dfd1;
        padding: 12px;
        white-space: pre-wrap;
      }
      /* Rendered off-screen: getBBox needs the SVG to be in the document. */
      #stage {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1000px;
      }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <div id="stage"></div>
    <script>
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      // Nothing on a page of music may sit on top of anything else. Two places
      // this kept happening: a rest pushed into the flag of the note before it,
      // and a slur cutting through a stem it passes over. Both are measured here
      // rather than eyeballed, because a spot fix is how they come back.
      import { generatePassage, SIGHT_LEVELS } from '../src/sightreading.js';
      import { renderScore } from '../src/score.js';

      const stage = document.getElementById('stage');
      const problems = [];
      const log = [];
      const SEEDS = 60;
      // Ink that comes within two units counts: at reading size, glyphs a unit
      // apart look like one mark, and that is exactly what a student misreads.
      const AIR = 2;

      const box = (node) => {
        const b = node.getBBox();
        return { x0: b.x, y0: b.y, x1: b.x + b.width, y1: b.y + b.height };
      };
      /** True when `b` is inside `air` of `a`, on both axes. */
      const overlap = (a, b, air = AIR) =>
        Math.min(a.x1 + air, b.x1) - Math.max(a.x0 - air, b.x0) > 0 &&
        Math.min(a.y1 + air, b.y1) - Math.max(a.y0 - air, b.y0) > 0;

      /** A point has no extent, so it needs its own test, not `overlap`. */
      const inside = (pt, b) => pt.x > b.x0 && pt.x < b.x1 && pt.y > b.y0 && pt.y < b.y1;

      /**
       * The `M … C …` a slur is drawn with, sampled into points — half a unit
       * apart, because a stem is only about two units wide and a coarser walk
       * steps straight over it.
       */
      function slurPoints(node) {
        const nums = (node.getAttribute('d').match(/-?\d+(\.\d+)?/g) || []).map(Number);
        if (nums.length < 8) return [];
        const [x1, y1, c1x, c1y, c2x, c2y, x2, y2] = nums;
        const span = Math.hypot(x2 - x1, y2 - y1) + Math.hypot(c1x - x1, c1y - y1);
        const count = Math.max(64, Math.ceil(span / 0.5));
        const pts = [];
        for (let i = 0; i <= count; i++) {
          const t = i / count;
          const u = 1 - t;
          pts.push({
            x: u * u * u * x1 + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x2,
            y: u * u * u * y1 + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y2,
            t,
          });
        }
        return pts;
      }

      for (const level of SIGHT_LEVELS) {
        let rests = 0;
        let slurs = 0;
        let accidentals = 0;
        const restHits = [];
        const slurHits = [];
        const accidentalHits = [];

        for (let seed = 0; seed < SEEDS; seed++) {
          const p = generatePassage({ level, seed });
          stage.innerHTML = renderScore(p, { tempoText: '\u2669 = 60' });
          const svg = stage.querySelector('svg');

          // ── rests ------------------------------------------------------
          const restBoxes = [...svg.querySelectorAll('g.score-rest')].map((n) => box(n));
          rests += restBoxes.length;

          const inkNodes = [
            ...svg.querySelectorAll('ellipse'),
            ...[...svg.querySelectorAll('path')].filter(
              (n) =>
                !n.closest('g.score-rest') &&
                !n.classList.contains('score-slur') &&
                !n.closest('g.score-acc'),
            ),
            ...[...svg.querySelectorAll('circle')].filter((n) => !n.closest('g.score-rest')),
          ];
          const ink = inkNodes.map((n) => box(n));

          for (const r of restBoxes) {
            const bad = ink.find((b) => overlap(r, b));
            if (bad) {
              restHits.push(`L${level} seed ${seed}: rest at ${r.x0.toFixed(0)} runs into ink at ${bad.x0.toFixed(0)}`);
              break;
            }
          }

          // ── accidentals ------------------------------------------------
          // A sharp in front of a note has to clear whatever the note before it
          // puts there — a flag sweeps a whole space right of its stem, and a dot
          // sits a step right of its head. A sign drawn through a flag is the bug
          // this measures.
          const accBoxes = [...svg.querySelectorAll('g.score-acc')].map((n) => box(n));
          accidentals += accBoxes.length;
          for (const a of accBoxes) {
            const bad = ink.find((b) => overlap(a, b));
            if (bad) {
              accidentalHits.push(
                `L${level} seed ${seed}: accidental at ${a.x0.toFixed(0)},${a.y0.toFixed(0)} runs into ink at ${bad.x0.toFixed(0)},${bad.y0.toFixed(0)}`,
              );
              break;
            }
          }

          // ── slurs ------------------------------------------------------
          // A stem is a line; a beam or a flag is a path; a head is an ellipse.
          // The slur must pass clear of all of them, its own two ends excepted.
          const solids = [
            ...[...svg.querySelectorAll('line')]
              .filter((n) => n.getAttribute('stroke-width') === '1.42')
              .map((n) => {
                const x = Number(n.getAttribute('x1'));
                const y1 = Number(n.getAttribute('y1'));
                const y2 = Number(n.getAttribute('y2'));
                return { x0: x - 0.9, x1: x + 0.9, y0: Math.min(y1, y2), y1: Math.max(y1, y2) };
              }),
            ...ink,
          ];

          for (const slur of svg.querySelectorAll('path.score-slur')) {
            slurs += 1;
            const near = solids.filter((b) => overlap(box(slur), b, 30));
            const bad = slurPoints(slur)
              .filter((pt) => pt.t > 0.06 && pt.t < 0.94)
              .find((pt) => near.find((b) => inside(pt, b)));
            if (bad) {
              slurHits.push(`L${level} seed ${seed}: slur passes through ink at ${bad.x.toFixed(0)},${bad.y.toFixed(0)}`);
              break;
            }
          }
        }

        log.push(
          `L${level}: rests ${restHits.length}/${SEEDS} broken (${rests} drawn) · ` +
            `slurs ${slurHits.length}/${SEEDS} broken (${slurs} drawn) · ` +
            `accidentals ${accidentalHits.length}/${SEEDS} broken (${accidentals} drawn)`,
        );
        problems.push(
          ...restHits.slice(0, 2),
          ...slurHits.slice(0, 2),
          ...accidentalHits.slice(0, 2),
        );
      }

      document.getElementById('report').textContent = problems.length
        ? `NOTATION FAILED\n${problems.join('\n')}\n\n${log.join('\n')}`
        : `NOTATION OK\n${log.join('\n')}`;
      document.title = problems.length ? 'NOTATION FAILED' : 'NOTATION OK';

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'notation', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
