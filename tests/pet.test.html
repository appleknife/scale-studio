<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pet room test</title>
  </head>
  <body>
    <pre id="report">running…</pre>
    <script type="module">
      // The pet room's promises, checked: notes only from counted takes, a soft
      // daily cap, a bonus for a new key, three takes to hatch, nothing ever lost
      // by staying away, and a room for each name.
      import * as P from '../src/pet.js';

      const problems = [];
      const log = [];
      const eq = (label, got, want) => {
        const ok = JSON.stringify(got) === JSON.stringify(want);
        if (!ok) problems.push(`${label}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`);
      };

      // Earning
      {
        const p = P.emptyPet();
        const first = P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' });
        eq('first take of the day: take + new key + first-of-day', first.amount, 3 + 4 + 5);
        eq('…and the new-key part is reported as the bonus', first.bonus, 4);
        const again = P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' });
        eq('the same key again: just the take', again.amount, 3);
        const d = P.earn(p, { kind: 'scale', id: 'D', dayKey: '2026-11-06' });
        eq('a new key today: a bonus on top', d.amount, 7);
        const sight = P.earn(p, { kind: 'sight', dayKey: '2026-11-06' });
        eq('the first sight reading of the day earns the new-key bonus', sight.amount, 7);
        const sight2 = P.earn(p, { kind: 'sight', dayKey: '2026-11-06' });
        eq('a second sight reading is a plain take', sight2.amount, 3);
        eq('…with no bonus', sight2.bonus, 0);
        const tomorrow = P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-07' });
        eq('a new day starts the bonuses again', tomorrow.amount, 12);
      }

      // The cap: forty takes in a day earn a lot less than forty times three.
      {
        const p = P.emptyPet();
        let total = 0;
        for (let i = 0; i < 40; i += 1) total += P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' }).amount;
        log.push(`forty takes of one scale in a day: ${total} notes`);
        if (total > P.DAILY_CAP + 30) problems.push(`the daily cap let ${total} notes through`);
        const after = P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' }).amount;
        eq('past the cap a take still earns a little', after, P.EARN.afterCap);
        const fresh = P.earn(p, { kind: 'scale', id: 'D', dayKey: '2026-11-06' });
        eq('past the cap a new key still earns its bonus', fresh.amount, P.EARN.afterCap + P.EARN.newKey);
      }

      // Growing up, the pet book, the next egg and switching
      {
        const p = P.emptyPet();
        P.chooseEgg(p, 'cat');
        for (let i = 0; i < P.HATCH_TAKES; i += 1) P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' });
        P.hatch(p, 0, 0.9);
        eq('a hatchling is a baby', P.stageOf(p.pet), 'baby');
        eq('a high roll is the plain colour', p.pet.variant, 'plain');
        eq('the pet book has it', P.dexCount(p), { found: 1, total: 10 });
        eq('no growing before it has a name', P.earn(p, { kind: 'scale', id: 'D', dayKey: '2026-11-06' }).grew, null);
        eq('…and its growth did not move', p.pet.growth, 0);
        P.name(p, 'Mochi');
        const stages = [];
        for (let i = 0; i < 2 * P.GROW_TAKES; i += 1) {
          const r = P.earn(p, { kind: 'scale', id: 'G', dayKey: `2026-11-${10 + (i % 9)}` });
          if (r.grew) stages.push(`${i + 1}:${r.grew}`);
        }
        eq('kid, then grown, a stage every GROW_TAKES takes', stages, [`${P.GROW_TAKES}:kid`, `${2 * P.GROW_TAKES}:grown`]);
        eq('the room celebrates a stage once', [P.unseenGrowth(p), P.unseenGrowth(p)], ['grown', null]);
        eq('a grown pet may have a new egg', P.canChooseNextEgg(p), true);
        eq('not a made-up animal', P.chooseNextEgg(p, 'dragon'), false);
        eq('a dog egg next', P.chooseNextEgg(p, 'dog'), true);
        eq('it starts already warm', p.egg.warmth, P.NEXT_EGG_WARMTH);
        eq('Mochi waits in the pet book', p.friends.map((f) => f.name), ['Mochi']);
        eq('no switching while an egg is in the nest', P.switchTo(p, 0), false);
        while (!P.readyToHatch(p)) P.earn(p, { kind: 'scale', id: 'A', dayKey: '2026-11-20' });
        P.hatch(p, 0, 0); // a roll of 0 is always rare
        eq('a low roll is the rare colour', p.pet.variant, 'rare');
        eq('two found now', P.dexCount(p).found, 2);
        P.name(p, 'Biscuit');
        eq('no third egg while the puppy is still growing', P.canChooseNextEgg(p), false);
        eq('Mochi comes back into the room', P.switchTo(p, 0) && p.pet.name, 'Mochi');
        eq('the puppy waits in the book', p.friends.map((f) => f.name), ['Biscuit']);
        eq('still no new egg: the puppy is not grown', P.canChooseNextEgg(p), false);
        eq('Mochi can be renamed', P.name(p, 'Mochi Two') && p.pet.name, 'Mochi Two');
        P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-21' });
        eq('only the pet in the room grows', p.friends[0].growth, 0);

        // A save from before pets grew: kept, as a kid, and in the pet book.
        const storage = new Map();
        const store = { getItem: (k) => storage.get(k) ?? null, setItem: (k, v) => storage.set(k, v) };
        store.setItem(P.storageKey('old'), JSON.stringify({ v: 1, notes: 9, pet: { species: 'fish', name: 'Fin', born: 0, fullness: 50, fedAt: 0, snacks: 2 } }));
        const old = P.loadPet('old', store);
        eq('an old pet is a kid, not a baby again', P.stageOf(old.pet), 'kid');
        eq('…plain, and in the pet book', [old.pet.variant, P.dexCount(old).found], ['plain', 1]);
        eq('…with no celebration owed', P.unseenGrowth(old), null);
      }

      // Feeding: a growth boost on a fed day, and tricks from favourite snacks
      {
        const p = P.emptyPet();
        P.chooseEgg(p, 'dog');
        for (let i = 0; i < P.HATCH_TAKES; i += 1) P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-12-01' });
        P.hatch(p, 0, 0.9);
        P.name(p, 'Biscuit');
        p.notes = 500;
        const day = '2026-12-02';
        const g0 = p.pet.growth;
        P.earn(p, { kind: 'scale', id: 'G', dayKey: day });
        eq('unfed: a take grows it by one (no penalty)', p.pet.growth - g0, 1);
        const meal = P.feed(p, 'berry', Date.now(), day);
        eq('the first snack of the day starts the boost', meal.boostStarted, true);
        eq('five boosted takes on offer', P.boostLeft(p, day), P.FED_BOOST);
        let boosted = 0;
        for (let i = 0; i < P.FED_BOOST + 3; i += 1) if (P.earn(p, { kind: 'scale', id: 'G', dayKey: day }).boosted) boosted += 1;
        eq('only FED_BOOST takes are doubled', boosted, P.FED_BOOST);
        eq('growth: 1 + 5×2 + 3', p.pet.growth - g0, 1 + 2 * P.FED_BOOST + 3);
        eq('a second snack the same day adds no more boost', [P.feed(p, 'cookie', Date.now(), day).boostStarted, P.boostLeft(p, day)], [false, 0]);
        eq('the next day starts unboosted', P.boostLeft(p, '2026-12-03'), 0);

        const learned = [];
        for (let i = 0; i < P.TRICK_EVERY * P.TRICKS.length + 3; i += 1) {
          const m = P.feed(p, 'treat', Date.now(), day);
          if (m.learned) learned.push(m.learned);
        }
        eq('a trick every TRICK_EVERY favourite snacks, in order', learned, P.TRICKS);
        eq('it knows them all', P.tricksOf(p.pet), P.TRICKS);
        eq('no next trick once all are learned', P.toNextTrick(p.pet), null);
        const plainSnacks = P.emptyPet();
        plainSnacks.pet = { species: 'cat', name: 'M', growth: 0, favs: 0 };
        plainSnacks.notes = 100;
        for (let i = 0; i < 10; i += 1) P.feed(plainSnacks, 'berry', Date.now(), day);
        eq('ordinary snacks teach no tricks', P.tricksOf(plainSnacks.pet), []);
      }

      // Eggs and hatching
      {
        const p = P.emptyPet();
        eq('an unknown animal is not an egg', P.chooseEgg(p, 'dragon'), false);
        eq('a cat egg can be chosen', P.chooseEgg(p, 'cat'), true);
        eq('not ready before practice', P.readyToHatch(p), false);
        for (let i = 0; i < P.HATCH_TAKES - 1; i += 1) P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' });
        eq('not ready one take short', P.readyToHatch(p), false);
        const last = P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' });
        eq('the last take warms the egg', last.warmed, true);
        eq('ready after three', P.readyToHatch(p), true);
        eq('it hatches', P.hatch(p), true);
        eq('into the chosen animal', p.pet.species, 'cat');
        eq('the egg is gone', p.egg, null);
        eq('a second egg cannot be chosen', P.chooseEgg(p, 'dog'), false);
        eq('an empty name is refused', P.name(p, '   '), false);
        eq('a name is kept', P.name(p, 'Mochi') && p.pet.name, 'Mochi');
      }

      // Feeding: never possible to owe, never harmful to skip
      {
        const p = P.emptyPet();
        P.chooseEgg(p, 'dog');
        for (let i = 0; i < 3; i += 1) P.earn(p, { kind: 'scale', id: 'G', dayKey: '2026-11-06' });
        const now = Date.UTC(2026, 10, 6, 12);
        P.hatch(p, now);
        const notes = p.notes;
        const snack = P.feed(p, 'treat', now);
        eq("the dog's favourite is a bone", snack && snack.look, 'bone');
        eq('a snack costs its price', p.notes, notes - snack.cost);
        p.notes = 0;
        eq('no notes, no snack — and no debt', P.feed(p, 'cake', now), null);
        eq('notes never go below zero', p.notes, 0);
        const month = now + 30 * 24 * 3600 * 1000;
        eq('a month away: still there, just peckish', [Boolean(p.pet), P.fullness(p, month), P.wantsSnack(p, month)], [true, 0, true]);
        P.visit(p, now);
        const back = P.visit(p, month);
        eq('coming back after a month is a welcome', back.longAway, true);
      }

      // Decorations
      {
        const p = P.emptyPet();
        p.notes = 100;
        eq('buy a rug', P.buy(p, 'rug'), true);
        eq('it is put out at once', P.isPlaced(p, 'rug'), true);
        eq('it cannot be bought twice', P.buy(p, 'rug'), false);
        P.place(p, 'rug');
        eq('it can be put away', P.isPlaced(p, 'rug'), false);
        P.buy(p, 'wall-mint');
        P.buy(p, 'wall-dots');
        eq('one wallpaper at a time', [P.isPlaced(p, 'wall-mint'), P.isPlaced(p, 'wall-dots')], [false, true]);
        p.notes = 3;
        eq('too few notes, no lamp', P.buy(p, 'lamp'), false);
      }

      // Each name has its own room, and a broken store is a fresh room
      {
        const mem = new Map();
        const storage = { getItem: (k) => mem.get(k) ?? null, setItem: (k, v) => mem.set(k, v) };
        const a = P.emptyPet();
        a.notes = 42;
        P.savePet('alice', a, storage);
        eq('alice keeps her notes', P.loadPet('alice', storage).notes, 42);
        eq('bob starts with none', P.loadPet('bob', storage).notes, 0);
        mem.set(P.storageKey('carol'), '{nope');
        eq('a broken store is a fresh room', P.loadPet('carol', storage).notes, 0);
      }

      document.getElementById('report').textContent = problems.length
        ? `PET FAILED\n${problems.join('\n')}\n\n${log.join('\n')}`
        : `PET OK\n${log.join('\n')}`;
      document.title = problems.length ? 'PET FAILED' : 'PET OK';
      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'pet', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
