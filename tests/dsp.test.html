<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DSP + scoring test</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script>
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      import { MAJOR_KEYS, MINOR_KEYS, buildScale } from '../src/music.js';
      import {
        PitchDetector,
        nextFloor,
        quietLevel,
        strongLevel,
      } from '../src/pitch.js';
      import { analyzeTake } from '../src/analyze.js';
      import { foldOctave } from '../src/tuner.js';

      const SR = 44100;
      const WINDOW = 2048;
      const HOP = 0.03;

      const problems = [];
      const log = [];
      fetch('/result', { method: 'POST', body: JSON.stringify({ stage: 'started' }) });

      /* ── 1. Scale data sanity ───────────────────────────────────────── */

      function checkScale(card, mode, form, variantIndex = 0) {
        const scale = buildScale(card, variantIndex, mode, form);
        const seq = scale.sequence;
        const id = `${scale.title} (${mode}${mode === 'minor' ? '/' + form : ''})`;
        if (seq.length !== 29) problems.push(`${id}: ${seq.length} notes`);
        if (seq[0].midi !== seq[28].midi) problems.push(`${id}: does not end on the tonic`);
        if (seq[14].midi !== seq[0].midi + 24) problems.push(`${id}: top is not two octaves up`);
        for (let i = 1; i <= 14; i++) {
          if (seq[i].midi <= seq[i - 1].midi) problems.push(`${id}: not ascending at ${i}`);
        }
        for (let i = 15; i < 29; i++) {
          if (seq[i].midi >= seq[i - 1].midi) problems.push(`${id}: not descending at ${i}`);
        }
        for (const n of seq) {
          if (n.midi < 55 || n.midi > 100) problems.push(`${id}: ${n.name} outside violin range`);
        }
        return scale;
      }

      const allScales = [];
      for (const card of MAJOR_KEYS) {
        for (let v = 0; v < card.variants.length; v++) {
          allScales.push(checkScale(card, 'major', 'melodic', v));
        }
      }
      for (const card of MINOR_KEYS) {
        for (const form of ['natural', 'harmonic', 'melodic']) {
          allScales.push(checkScale(card, 'minor', form));
        }
      }
      log.push(`scales checked: ${allScales.length}`);

      // Enharmonic pairs must sound identical.
      const byId = Object.fromEntries(MAJOR_KEYS.map((c) => [c.id, c]));
      for (const [a, b] of [['B', 'C\u266D'], ['F\u266F', 'G\u266D'], ['C\u266F', 'D\u266D']]) {
        const card = MAJOR_KEYS.find((c) => c.variants.length === 2 && c.variants.some((v) => v.name === a));
        const s1 = buildScale(card, 0, 'major');
        const s2 = buildScale(card, 1, 'major');
        const same = s1.sequence.every((n, i) => n.midi === s2.sequence[i].midi);
        if (!same) problems.push(`enharmonic mismatch: ${a} vs ${b}`);
      }

      /* ── 2. Synthesis ───────────────────────────────────────────────── */

      function renderSynth(sequence, opts = {}) {
        const {
          durations = null,
          detune = [],
          gaps = {},
          lead = 0.7,
          vibrato = 0.18,
          amplitude = 0.2,
        } = opts;
        const durs = durations || sequence.map(() => 0.55);
        const starts = [];
        let t = lead;
        for (let i = 0; i < sequence.length; i++) {
          starts.push(t);
          t += durs[i] + (gaps[i] || 0);
        }
        const total = t + 1.6;
        const buf = new Float32Array(Math.ceil(total * SR));

        sequence.forEach((note, i) => {
          const start = starts[i];
          const dur = durs[i];
          if (dur <= 0) return;
          const cents = detune[i] || 0;
          const f0 = 440 * Math.pow(2, (note.midi + cents / 100 - 69) / 12);
          const len = Math.floor(dur * SR);
          let phase = 0;
          for (let s = 0; s < len; s++) {
            const tt = s / SR;
            let amp = 1;
            const attack = 0.03;
            const release = 0.06;
            if (tt < attack) amp = tt / attack;
            else if (tt > dur - release) amp = Math.max(0, (dur - tt) / release);
            amp *= 0.85 + 0.15 * Math.exp(-tt * 5);
            const vib = vibrato * Math.sin(2 * Math.PI * 5.4 * tt + i * 0.7);
            const f = f0 * Math.pow(2, vib / 12);
            phase += (2 * Math.PI * f) / SR;
            let v = 0;
            for (let k = 1; k <= 7; k++) v += Math.sin(phase * k) / Math.pow(k, 1.15);
            const noise = (Math.random() - 0.5) * 0.03;
            const idx = Math.floor(start * SR) + s;
            if (idx < buf.length) buf[idx] += amplitude * amp * (v * 0.5 + noise);
          }
        });
        return buf;
      }

      function framesOf(buf) {
        const det = new PitchDetector({ sampleRate: SR, bufferSize: WINDOW });
        const frames = [];
        const win = new Float32Array(WINDOW);
        const end = buf.length / SR - WINDOW / SR;
        for (let t = 0; t < end; t += HOP) {
          const i0 = Math.floor(t * SR);
          win.set(buf.subarray(i0, i0 + WINDOW));
          const { freq, clarity, rms } = det.detect(win);
          frames.push({ t, freq, clarity, rms });
        }
        return frames;
      }

      function run(name, scale, opts, expectedSequence = scale.sequence) {
        const buf = renderSynth(opts.sequence || scale.sequence, opts);
        const frames = framesOf(buf);
        const result = analyzeTake(frames, { ...scale, sequence: expectedSequence });
        const s = result.stats;
        log.push('');
        log.push(`── ${name}`);
        log.push(
          `   score ${result.score}%  | notes ${Math.round(result.components.accuracy * 100)}%  ` +
            `int ${Math.round(result.components.intonation * 100)}%  ` +
            `steady ${Math.round(result.components.steadiness * 100)}%  ` +
            `flow ${Math.round(result.components.continuity * 100)}%`,
        );
        log.push(
          `   heard ${s.heard}/${s.expected} · exact ${s.exact} · wrong ${s.wrong} · missed ${s.missed} ` +
            `· extra ${s.extra} · stops ${s.stops} · bpm ${s.bpm}`,
        );
        if (result.tips.length) {
          for (const tip of result.tips) log.push(`   tip: ${tip.title} — ${tip.text.slice(0, 90)}…`);
        }
        const off = result.notes
          .filter((n) => n.status === 'exact' && Math.abs(n.cents) > 22)
          .map((n) => `${n.note.name}:${n.cents.toFixed(0)}c`);
        log.push(`   off-pitch: ${off.join(', ') || 'none'}`);
        return result;
      }

      // Looked up by id, not by position: the key list is ordered the way a
      // violinist meets the scales, so positions move.
      const keyById = (id) => MAJOR_KEYS.find((k) => k.id === id);
      const cMajor = buildScale(keyById('C'), 0, 'major');

      // A. clean, steady, in tune
      const clean = run('clean scale', cMajor, { vibrato: 0.18 });
      if (clean.score < 88) problems.push(`clean scale scored only ${clean.score}`);

      // B. a few notes off
      const detune = [];
      detune[8] = 38;
      detune[9] = -34;
      detune[20] = 46;
      const detuned = run('three notes out of tune', cMajor, { vibrato: 0.12, detune });
      if (detuned.score >= clean.score) problems.push('detuned take did not score lower');
      if (detuned.components.intonation > 0.97) problems.push('intonation not penalised');

      // C. uneven + a real pause
      const durs = cMajor.sequence.map((_, i) => (i % 2 ? 0.42 : 0.72));
      const uneven = run('uneven tempo with a stop at the top', cMajor, {
        durations: durs,
        gaps: { 14: 1.4 },
        vibrato: 0.1,
      });
      if (uneven.components.steadiness > 0.9) problems.push('steadiness not penalised');
      if (uneven.stats.stops < 1) problems.push('stop not detected');

      // D. skipped note
      const skipped = cMajor.sequence.filter((_, i) => i !== 5);
      const skip = run('one note skipped', cMajor, { sequence: skipped, vibrato: 0.1 });
      if (skip.components.accuracy > 0.97) problems.push('skip not penalised');
      if (skip.stats.extra > 2) problems.push('skip produced many spurious extras');

      // E. wrong octave (G major started on the G above the open string)
      const gMajor = buildScale(keyById('G'), 0, 'major');
      const highSeq = gMajor.sequence.map((n) => ({ ...n, midi: n.midi + 12 }));
      const oct = run('octave high', gMajor, { sequence: highSeq, vibrato: 0.1 });
      if (oct.stats.octaveShift !== 12) problems.push(`octave shift not recognised (${oct.stats.octaveShift})`);
      if (!oct.tips.some((t) => t.kind === 'range')) problems.push('no octave tip');

      // F. slow, but accurate
      const slow = run('slow and accurate', cMajor, {
        durations: cMajor.sequence.map(() => 0.9),
        vibrato: 0.15,
      });
      if (slow.score < 85) problems.push(`slow playing punished (${slow.score})`);

      // G. Levels I–IV use one-octave scales: 15 notes, tonic to tonic
      const cMajor1 = buildScale(keyById('C'), 0, 'major', 'melodic', 1);
      const short = run('one octave', cMajor1, { vibrato: 0.15 });
      if (short.stats.expected !== 15) problems.push(`one-octave scale has ${short.stats.expected} notes`);
      if (short.score < 90) problems.push(`one-octave take scored only ${short.score}`);

      // I. the same pitch sitting off all the way through: the one thing a
      // take can say that a score cannot — which finger to look at.
      {
        // Every E in the scale half a semitone-ish sharp, nothing else touched.
        const biased = [];
        cMajor.sequence.forEach((n, i) => {
          if (n.name && n.name.startsWith('E')) biased[i] = 24;
        });
        const bent = run('one pitch sitting high', cMajor, { vibrato: 0.1, detune: biased });
        const habit = bent.habits;
        if (!habit || !habit.bias) {
          problems.push('a pitch that sat off all the way through was not noticed');
        } else {
          if (!habit.bias.name || !habit.bias.name.startsWith('E')) {
            problems.push(`the wrong pitch was blamed (${habit.bias.name})`);
          }
          if (!(habit.bias.cents > 10)) problems.push(`bias strength looks wrong (${habit.bias.cents})`);
          if (!bent.tips.some((tip) => tip.kind === 'intonation' && /E/.test(tip.title))) {
            problems.push('no tip named the pitch that sat off');
          }
        }
      }

      // J. speeding up through the take: late notes come quicker than early ones.
      {
        const n = cMajor.sequence.length;
        const speeding = cMajor.sequence.map((_, i) => 0.9 - (0.45 * i) / (n - 1));
        const rush = run('speeding up', cMajor, { durations: speeding, vibrato: 0.1 });
        if (!rush.habits || !rush.habits.drift) {
          problems.push('a take that sped up through it was not noticed');
        } else {
          if (!rush.habits.drift.faster) problems.push('the speed-up was read as a slow-down');
          if (!rush.tips.some((tip) => tip.kind === 'rhythm')) problems.push('no tip about the rush');
        }
        // A steady take must not be accused of either.
        if (clean.habits && clean.habits.drift) problems.push('a steady take was called uneven');
      }

      // H. minor scale, raised 7th spelled correctly
      const aMinor = buildScale(MINOR_KEYS.find((k) => k.id === 'Am'), 0, 'minor', 'harmonic');
      const aMinorNotes = aMinor.sequence.map((n) => n.name).join(' ');
      log.push('');
      log.push(`A harmonic minor: ${aMinorNotes}`);

      /* ── I. The learned noise floor ────────────────────────────────── */
      //
      // A phone's microphone goes through the system's own gain control and
      // noise gate, so a softly bowed note can arrive at a third of the level a
      // laptop hears. The thresholds are learned from room noise instead of
      // fixed — this pins the learning down.
      {
        // A quiet room: the floor settles near the noise, and a soft note that a
        // fixed 0.004 would have thrown away is still heard.
        let floor = 0.0012;
        for (let i = 0; i < 400; i++) floor = nextFloor(floor, 0.0007);
        const soft = 0.0032;
        log.push(
          `quiet room: floor ${floor.toFixed(5)} · note line ${quietLevel(floor).toFixed(5)} · ` +
            `start line ${strongLevel(floor).toFixed(5)} · a ${soft} note ${soft > quietLevel(floor) ? 'heard' : 'thrown away'}`,
        );
        if (floor > 0.0009) problems.push(`the floor did not settle in a quiet room (${floor})`);
        if (!(soft > quietLevel(floor))) problems.push('a soft note was still thrown away in a quiet room');

        // Playing never teaches the floor anything: a bow cannot raise it.
        let loud = 0.0012;
        for (let i = 0; i < 200; i++) loud = nextFloor(loud, 0.08);
        if (loud > 0.0013) problems.push(`playing raised the noise floor to ${loud}`);

        // A loud room looks like the instrument to the estimator, so the line
        // stays where it is rather than chasing the noise — the pitch detector's
        // clarity gate is what keeps noise out, and this is the honest limit of
        // level alone. What matters is that the line never runs away.
        let noisy = 0.0012;
        for (let i = 0; i < 400; i++) noisy = nextFloor(noisy, 0.008);
        log.push(`loud room: floor ${noisy.toFixed(5)} · note line ${quietLevel(noisy).toFixed(5)}`);
        if (noisy > 0.0013) problems.push(`a loud room moved the floor to ${noisy}`);
        if (quietLevel(1) > 0.0121) problems.push('the note line is capped too high');
        if (quietLevel(1e-9) < 0.00159) problems.push('the note line is capped too low');
        if (Math.abs(quietLevel(0.0012) - 0.0036) > 1e-6)
          problems.push('the default floor no longer lands on the old fixed 0.004 line');

        // And the starting gate stays above the note line, always.
        for (const f of [0.0003, 0.0012, 0.003, 0.01, 0.05]) {
          if (strongLevel(f) <= quietLevel(f)) problems.push(`the start line is under the note line at ${f}`);
        }
      }


      /* ── J. The G string ─────────────────────────────────────────────── */
      //
      // The lowest string is the one a phone microphone struggles with: G3 is
      // 196 Hz, the fundamental is weak through a small speaker-grade mic, and
      // the second harmonic at 392 Hz is not. A detector can lock onto that
      // harmonic and report a G played an octave high — which the tuner then
      // showed as a needle pinned sharp, or as no string at all. The tuner folds
      // an octave-high reading back onto the string, and listens with twice the
      // window. This is that, measured on a signal shaped like the problem.
      {
        const G3 = 196.0;
        const build = (samples, weakFundamental) => {
          const x = new Float32Array(samples);
          for (let i = 0; i < samples; i++) {
            const t = i / SR;
            const w = 2 * Math.PI * G3 * t;
            const w2 = 2 * w;
            const w3 = 3 * w;
            // A violin's G with the fundamental rolled off by the microphone.
            const fundamental = weakFundamental ? 0.05 : 0.8;
            x[i] =
              fundamental * Math.sin(w) +
              1.0 * Math.sin(w2) +
              0.35 * Math.sin(w3) +
              0.12 * Math.sin(2 * Math.PI * 392.5 * t) * 0 +
              (Math.random() - 0.5) * 0.01;
          }
          return x;
        };

        for (const weak of [false, true]) {
          const short = new PitchDetector({ sampleRate: SR, bufferSize: 2048, minFreq: 150, maxFreq: 1800 });
          const long = new PitchDetector({ sampleRate: SR, bufferSize: 4096, minFreq: 150, maxFreq: 1800 });
          const a = short.detect(build(2048, weak));
          const b = long.detect(build(4096, weak));
          const foldedA = foldOctave(a.freq);
          const foldedB = foldOctave(b.freq);
          log.push(
            `G3 (${weak ? 'fundamental rolled off' : 'full'}): 2048 window reads ${a.freq.toFixed(1)} Hz ` +
              `(folded ${foldedA.toFixed(1)}) · 4096 reads ${b.freq.toFixed(1)} Hz (folded ${foldedB.toFixed(1)})`,
          );
          // Whatever the detector does, the tuner must end up on the G string.
          if (Math.abs(foldedA - G3) > 1) problems.push(`the short window folded to ${foldedA.toFixed(1)} Hz, not 196`);
          if (Math.abs(foldedB - G3) > 1) problems.push(`the long window folded to ${foldedB.toFixed(1)} Hz, not 196`);
        }

        // A fourth above must not be folded onto anything: only octaves fold.
        if (Math.abs(foldOctave(392) - 196) > 0.5) problems.push('an octave-high G was not folded');
        if (Math.abs(foldOctave(196) - 196) > 0.5) problems.push('a correct G was folded when it should not be');
        if (Math.abs(foldOctave(440) - 440) > 0.5) problems.push('the A string was folded when it should not be');
      }
      const payload = {
        problems,
        log: log.join('\n'),
      };
      document.getElementById('out').textContent = 'PROBLEMS: ' + (problems.length ? problems.join(' | ') : 'none') + '\n' + log.join('\n');
      fetch('/result', { method: 'POST', body: JSON.stringify(payload, null, 2) });
    </script>
  </body>
</html>
