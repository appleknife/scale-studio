<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Practice log rules</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      pre {
        background: #fffdfa;
        border: 1px solid #e8dfd1;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="report">running…</pre>
    <script>
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      // The rules behind the log are the whole motivational design: a streak that
      // survives a planned day off, never more than two of those a week, and a
      // scale that only counts as ready after two separate days. All of it is
      // arithmetic on dates, so it is tested as arithmetic.
      import * as J from '../src/journal.js';

      const problems = [];
      const log = [];
      const eq = (name, got, want) => {
        const a = JSON.stringify(got);
        const b = JSON.stringify(want);
        if (a !== b) problems.push(`${name}: got ${a}, wanted ${b}`);
      };

      // A fixed Wednesday, so the test does not depend on when it is run.
      const TODAY = '2026-03-11';

      /* ── dates ─────────────────────────────────────────────────────── */
      eq('weekStart is a Monday', J.weekStart(TODAY), '2026-03-09');
      eq('addDays crosses a month', J.addDays('2026-02-27', 3), '2026-03-02');
      eq('addDays goes back a year', J.addDays('2026-01-01', -1), '2025-12-31');
      eq('dayKey is local and zero-padded', J.dayKey(new Date(2026, 2, 5)), '2026-03-05');

      /* ── the streak ────────────────────────────────────────────────── */
      {
        const s = J.emptyState();
        J.log(s, TODAY, 'scales');
        eq('one day', J.streak(s, TODAY), 1);

        J.log(s, J.addDays(TODAY, -1), 'piece');
        J.log(s, J.addDays(TODAY, -2), 'sight');
        eq('three in a row', J.streak(s, TODAY), 3);

        // A gap two days back stops it there.
        J.log(s, J.addDays(TODAY, -4), 'scales');
        eq('a gap ends the run', J.streak(s, TODAY), 3);
      }

      {
        // Not practicing yet today shows yesterday's run rather than zero: a good
        // habit should not look lost before breakfast.
        const s = J.emptyState();
        J.log(s, J.addDays(TODAY, -1), 'scales');
        J.log(s, J.addDays(TODAY, -2), 'scales');
        eq('today not done yet', J.streak(s, TODAY), 2);
      }

      {
        // A planned rest day keeps the run alive without adding to it.
        const s = J.emptyState();
        J.log(s, TODAY, 'scales');
        J.markRest(s, J.addDays(TODAY, -1));
        J.log(s, J.addDays(TODAY, -2), 'scales');
        eq('rest day bridges', J.streak(s, TODAY), 2);
      }

      {
        // Two a week, and no more.
        const s = J.emptyState();
        eq('first rest', J.markRest(s, '2026-03-09'), 'marked');
        eq('second rest', J.markRest(s, '2026-03-10'), 'marked');
        eq('third rest', J.markRest(s, '2026-03-11'), 'limit');
        eq('rest count', s.rests.length, 2);
        eq('same day again clears', J.markRest(s, '2026-03-09'), 'cleared');
        eq('and frees the slot', J.markRest(s, '2026-03-11'), 'marked');
        // Next week starts with two fresh ones.
        eq('next week is a new week', J.markRest(s, '2026-03-16'), 'marked');
      }

      /* ── the five-week grid ────────────────────────────────────────── */
      {
        const s = J.emptyState();
        J.log(s, TODAY, 'scales');
        const weeks = J.weeks(s, TODAY, 5);
        eq('five rows', weeks.length, 5);
        eq('seven columns', weeks[0].length, 7);
        eq('this week starts Monday', weeks[4][0].key, '2026-03-09');
        eq('the last cell is Sunday', weeks[4][6].key, '2026-03-15');
        eq('today is marked', weeks[4][2].today, true);
        eq('the future is future', weeks[4][3].future, true);
        eq('the past is not', weeks[0][0].future, false);
        eq('today is filled', weeks[4][2].practiced, true);
      }

      /* ── scales ready ──────────────────────────────────────────────── */
      {
        const s = J.emptyState();
        const ids = ['G', 'D', 'A'];
        J.noteScale(s, 'G', '2026-03-09', 94);
        eq('one clean day is not ready', J.scalesReady(s, ids)[0].ready, false);
        J.noteScale(s, 'G', '2026-03-10', 91);
        eq('two clean days are ready', J.scalesReady(s, ids)[0].ready, true);

        // The same day twice does not count twice.
        J.noteScale(s, 'D', '2026-03-09', 99);
        J.noteScale(s, 'D', '2026-03-09', 98);
        eq('same day twice', J.scalesReady(s, ids)[1].ready, false);

        // A scruffy take is remembered but does not count as a day.
        J.noteScale(s, 'A', '2026-03-09', 70);
        J.noteScale(s, 'A', '2026-03-10', 72);
        eq('low scores are not days', J.scalesReady(s, ids)[2].days, 0);
        eq('but the best is kept', J.scalesReady(s, ids)[2].best, 72);
      }

      /* ── the lesson sheet ──────────────────────────────────────────── */
      {
        const s = J.emptyState();
        const ids = ['G', 'D', 'A'];
        J.logTake(s, '2026-03-09', 'scales');
        J.logTake(s, '2026-03-09', 'scales');
        J.log(s, '2026-03-10', 'sight');
        J.toggleHard(s, '2026-03-10', 'shifts');
        J.toggleHard(s, '2026-03-11', 'shifts');
        J.toggleHard(s, '2026-03-11', 'intonation');
        J.noteScale(s, 'G', '2026-03-09', 95);
        J.noteScale(s, 'G', '2026-03-10', 95);
        const sheet = J.weekSheet(s, '2026-03-11', ids);
        eq('week start', sheet.start, '2026-03-09');
        // Marking what was hard is not itself practice — the day needs a tag or a
        // take, or a stray tap would keep the streak alive on its own.
        eq('days practiced', sheet.days, 2);
        eq('takes', sheet.takes, 2);
        eq('scales tagged', sheet.tags.scales, 1);
        eq('sight tagged', sheet.tags.sight, 1);
        eq('hard, most often first', sheet.hard[0], { key: 'shifts', n: 2 });
        eq('hard, second', sheet.hard[1], { key: 'intonation', n: 1 });
        eq('ready list', sheet.ready, ['G']);
        eq('total offered', sheet.total, 3);
      }

      /* ── toggling ──────────────────────────────────────────────────── */
      {
        const s = J.emptyState();
        eq('tag off again', (J.toggleHard(s, TODAY, 'tone'), J.hardThatDay(s, TODAY)), ['tone']);
        J.toggleHard(s, TODAY, 'tone');
        eq('empty after two taps', J.hardThatDay(s, TODAY), []);
        eq('a day with no tags is not practice', J.practiced(s, TODAY), false);
        J.log(s, TODAY, 'tuner');
        eq('logging a tag makes it practice', J.practiced(s, TODAY), true);
      }

      /* ── storage round trip ────────────────────────────────────────── */
      {
        const store = new Map();
        const fake = {
          getItem: (k) => (store.has(k) ? store.get(k) : null),
          setItem: (k, v) => store.set(k, String(v)),
          removeItem: (k) => store.delete(k),
        };
        const s = J.load(fake);
        eq('empty store gives an empty log', s.days, {});
        J.log(s, TODAY, 'scales');
        J.save(s, fake);
        eq('it survives the round trip', J.practiced(J.load(fake), TODAY), true);
        J.clear(fake);
        eq('and clears', J.load(fake).days, {});
        // A store that throws must not take the app down with it.
        const blocked = () => {
          throw new Error('blocked');
        };
        const broken = { getItem: blocked, setItem: blocked, removeItem: blocked };
        eq('a blocked store is survivable', J.load(broken).days, {});
        eq('and it says so rather than pretending', J.save(s, broken), false);
        eq('a working store says it worked', J.save(s, fake), true);
      }

      /* ── copies ───────────────────────────────────────────────────── */
      {
        const a = J.emptyState();
        J.logTake(a, '2026-03-09', 'scales');
        J.logTake(a, '2026-03-09', 'scales');
        J.toggleHard(a, '2026-03-09', 'shifts');
        J.markRest(a, '2026-03-10');
        J.noteScale(a, 'G', '2026-03-09', 94);
        a.plan = 'afterDinner';

        const text = J.serialise(a, new Date(2026, 2, 11), 'Maya');
        eq('a copy names the app', JSON.parse(text).app, 'scale-studio');
        eq('a copy is dated', JSON.parse(text).saved, '2026-03-11');
        eq('a copy remembers whose it is', JSON.parse(text).profile, 'Maya');
        const back = J.parse(text);
        // A rest day is not a practiced day, so it lives in `rests` and not in `days`.
        eq('a copy survives the round trip', J.totalDays(back.state), 1);
        eq('with its takes', back.state.days['2026-03-09'].takes, 2);
        eq('and its rest day', back.state.rests, ['2026-03-10']);
        eq('and it says whose it is', back.profile, 'Maya');

        // A copy from before names existed has no profile field at all, which is
        // different from one saved under the nameless default log.
        const old = JSON.parse(text);
        delete old.profile;
        eq('an old copy has no name', J.parse(JSON.stringify(old)).profile, null);
        eq('a nameless copy is still a name', J.parse(J.serialise(a, new Date(2026, 2, 11), '')).profile, '');

        eq('junk is refused', J.parse('not json at all'), null);
        eq('someone else\'s json is refused', J.parse('{"app":"other"}'), null);
        eq('a broken log is refused', J.parse('{"app":"scale-studio","kind":"practice-log"}'), null);

        // Loading a copy adds what is missing and leaves what is here. Loading it
        // a second time must land in exactly the same place, or a student who
        // clicks twice ends up with a week twice as busy as it was.
        const into = J.emptyState();
        J.logTake(into, '2026-03-11', 'piece');
        const once = J.merge(into, back.state);
        const twice = J.merge(once, back.state);
        eq('merge keeps the day it already had', once.days['2026-03-11'].tags, ['piece']);
        eq('merge adds the other days', J.totalDays(once), 2);
        eq('merge keeps takes apart', once.days['2026-03-09'].takes, 2);
        eq('merging twice is the same as once', J.serialise(twice, new Date(2026, 2, 11)),
          J.serialise(once, new Date(2026, 2, 11)));
        eq('takes are the larger, never the sum', twice.days['2026-03-09'].takes, 2);
        eq('the plan comes across when there is none here', once.plan, 'afterDinner');
        eq('and is not overwritten when there is one', J.merge({ ...into, plan: 'afterSchool' }, back.state).plan, 'afterSchool');
        eq('scale days are joined', J.merge(once, back.state).scales.G.days.length, 1);
        eq('a better score wins', J.merge(once, back.state).scales.G.best, 94);
        eq('the whole state has a day count', J.totalDays(once), 2);

        // A copy taken before the log existed merges into an empty log cleanly.
        const fresh = J.merge(J.emptyState(), back.state);
        eq('an empty target takes the whole copy', J.totalDays(fresh), 1);
      }

      /* ── more than one name ───────────────────────────────────────── */
      {
        const store = J.emptyStore();
        const first = J.makeProfile('');
        store.profiles.push(first);
        store.current = first.id;

        // A device nobody has named yet: the first real name takes the empty log
        // over, rather than sitting beside a "Me" nobody owns.
        const maya = J.addProfile(store, 'Maya');
        eq('the first name takes the empty log', store.profiles.length, 1);
        eq('and is the one on screen', J.active(store).name, 'Maya');
        eq('it kept its identity', maya.id, first.id);

        J.logTake(J.active(store).state, '2026-03-09', 'scales');
        const jonah = J.addProfile(store, '  Jonah  ');
        eq('a second name is a second log', store.profiles.length, 2);
        eq('the name is trimmed', jonah.name, 'Jonah');
        eq('the new one is empty', J.totalDays(J.active(store).state), 0);
        eq('Maya still has her day', J.totalDays(store.profiles[0].state), 1);

        // Typing a name that is already there is a switch, not a duplicate.
        const again = J.addProfile(store, 'maya');
        eq('the same name is not added twice', store.profiles.length, 2);
        eq('it switches instead', J.active(store).name, 'Maya');
        eq('the id is Maya\'s', again.id, maya.id);

        eq('a name cannot be stolen', J.renameProfile(store, jonah.id, 'Maya'), false);
        eq('renaming works', J.renameProfile(store, jonah.id, 'Jonah P.'), true);
        eq('and sticks', J.active(store).name, 'Maya');

        const store2 = new Map();
        const fake = {
          getItem: (k) => (store2.has(k) ? store2.get(k) : null),
          setItem: (k, v) => store2.set(k, String(v)),
          removeItem: (k) => store2.delete(k),
        };
        eq('the store saves', J.saveStore(store, fake), true);
        const loaded = J.loadStore(fake);
        eq('two names come back', loaded.profiles.length, 2);
        eq('with their own days', J.totalDays(loaded.profiles[0].state), 1);
        eq('and the empty one still empty', J.totalDays(loaded.profiles[1].state), 0);

        // A device from before names: one log, which must become a log and not a
        // loss.
        const old = new Map();
        const oldStore = {
          getItem: (k) => (old.has(k) ? old.get(k) : null),
          setItem: (k, v) => old.set(k, String(v)),
          removeItem: (k) => old.delete(k),
        };
        const before = J.emptyState();
        J.logTake(before, '2026-03-09', 'scales');
        J.save(before, oldStore);
        const migrated = J.loadStore(oldStore);
        eq('an old log migrates to one name', migrated.profiles.length, 1);
        eq('with nothing lost', J.totalDays(J.active(migrated).state), 1);
        eq('and no name invented', J.active(migrated).name, '');

        eq('removing a name leaves the rest', J.removeProfile(store, jonah.id) && store.profiles.length, 1);
        eq('removing the last leaves a fresh nameless log', J.removeProfile(store, maya.id) && J.active(store).name, '');
        eq('the fresh log is empty', J.totalDays(J.active(store).state), 0);
      }

      /* ── the note at the foot of the sheet ─────────────────────── */
      //
      // The sentence has to fit the week that happened. These check the choosing,
      // not the wording: an empty log is never congratulated, a met goal is
      // named as met, one day short is its own case, and a thin week is not a
      // scolding.
      {
        const ids = ['G', 'D'];
        const empty = J.emptyState();
        eq('nothing logged is a beginning, not a failure', J.weekNote(empty, TODAY, ids).kind, 'start');

        const met = J.emptyState();
        J.setGoal(met, 'days', 3);
        J.logTake(met, '2026-03-09');
        J.logTake(met, '2026-03-10');
        J.logTake(met, '2026-03-11');
        eq('the goal that was met', J.weekNote(met, TODAY, ids).kind, 'goalMet');

        const near = J.emptyState();
        J.setGoal(near, 'days', 3);
        J.logTake(near, '2026-03-09');
        J.logTake(near, '2026-03-10');
        eq('one day short is still reachable', J.weekNote(near, TODAY, ids).kind, 'goalNear');

        const short = J.emptyState();
        J.setGoal(short, 'days', 5);
        J.logTake(short, '2026-03-10');
        const shortNote = J.weekNote(short, TODAY, ids);
        eq('far short is its own sentence', shortNote.kind, 'goalShort');
        eq('and it knows the numbers', `${shortNote.days}/${shortNote.target}`, '1/5');

        // Four days by Thursday: a heavy week with no goal set.
        const lots = J.emptyState();
        ['2026-03-09', '2026-03-10', '2026-03-11', '2026-03-12'].forEach((k) => J.logTake(lots, k));
        eq('a heavy week with no goal', J.weekNote(lots, '2026-03-12', ids).kind, 'plenty');

        // A week that is quiet after history is not the same as a log that is new.
        const quiet = J.emptyState();
        J.logTake(quiet, '2026-03-02');
        eq('a quiet week after history', J.weekNote(quiet, TODAY, ids).kind, 'quiet');

        // The extra sentence prefers a named scale, then the hard thing, then the run.
        const named = J.emptyState();
        J.noteScale(named, 'G', '2026-03-09', 94);
        J.noteScale(named, 'G', '2026-03-10', 95);
        const namedNote = J.weekNote(named, TODAY, ids);
        eq('a scale that came good is noticed', namedNote.ready.join(','), 'G');

        const hard = J.emptyState();
        J.logTake(hard, '2026-03-09');
        J.toggleHard(hard, '2026-03-09', 'rhythm');
        eq('the thing they called hard is carried', J.weekNote(hard, TODAY, ids).hard, 'rhythm');
      }

      document.getElementById('report').textContent = problems.length
        ? `LOG FAILED\n${problems.join('\n')}`
        : 'LOG OK';
      document.title = problems.length ? 'LOG FAILED' : 'LOG OK';

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'journal', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
