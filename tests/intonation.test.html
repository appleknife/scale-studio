<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Intonation lane test</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 20px;
        background: #faf7f1;
        color: #221e19;
      }
      pre {
        background: #fffdfa;
        border: 1px solid #e8dfd1;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script>
      window.addEventListener('error', (e) => {
        fetch('/result', {
          method: 'POST',
          body: JSON.stringify({ stage: 'error', message: e.message, stack: e.error && e.error.stack }),
        });
      });
    </script>
    <script type="module">
      // The lane that says which way a note was off, drawn under the notes
      // themselves. Its geometry is pure, so it can be weighed here without a
      // microphone or a browser layout: the axis, the clamping, which notes count
      // as heard, the sentence that goes with it, and the marks it draws.
      import {
        SPAN,
        bandFor,
        clampCents,
        isHeard,
        summariseIntonation,
        yForCents,
        intonationLane,
      } from '../src/intonation.js';

      const problems = [];
      const log = [];
      const near = (a, b, slack = 0.01) => Math.abs(a - b) <= slack;

      /* ── 1. The axis ────────────────────────────────────────────────── */
      {
        const centre = 50;
        const half = 24;
        // Up is sharp: a positive reading is drawn above the centre line.
        if (!(yForCents(30, { centre, half }) < centre)) problems.push('a sharp note was not drawn above the line');
        if (!(yForCents(-30, { centre, half }) > centre)) problems.push('a flat note was not drawn below the line');
        if (!near(yForCents(0, { centre, half }), centre)) problems.push('zero cents is not on the centre line');
        // Symmetry, so "a little sharp" and "a little flat" look alike.
        const up = centre - yForCents(22, { centre, half });
        const down = yForCents(-22, { centre, half }) - centre;
        if (!near(up, down)) problems.push('sharp and flat are not drawn symmetrically');
        // Length follows the amount: 50 cents is exactly `half` from the line.
        if (!near(centre - yForCents(SPAN, { centre, half }), half))
          problems.push('the end of the axis is not the end of the lane');
        if (!(yForCents(40, { centre, half }) < yForCents(20, { centre, half })))
          problems.push('a bigger reading is not drawn further out');
        log.push(`axis: +50 is ${half} above the line, −50 is ${half} below, 0 on it`);
      }

      /* ── 2. Clamping ────────────────────────────────────────────────── */
      {
        if (clampCents(80) !== SPAN) problems.push('a reading past the axis was not clamped');
        if (clampCents(-80) !== -SPAN) problems.push('a flat reading past the axis was not clamped');
        if (clampCents(NaN) !== 0) problems.push('a missing reading did not fall back to the centre');
      }

      /* ── 3. The bands ───────────────────────────────────────────────── */
      {
        const cases = [
          [0, 'centred'],
          [14, 'centred'],
          [16, 'close'],
          [30, 'close'],
          [31, 'off'],
          [-44, 'off'],
        ];
        for (const [cents, key] of cases) {
          if (bandFor(cents).key !== key) problems.push(`${cents} cents fell in "${bandFor(cents).key}", not "${key}"`);
        }
        if (bandFor(NaN).key !== 'centred') problems.push('a missing reading was banded as off');
      }

      /* ── 4. Heard, missed, and the sentence ─────────────────────────── */
      {
        const notes = [
          { status: 'exact', cents: 6 },
          { status: 'exact', cents: 34 },
          { status: 'missed', cents: 0 },
          { status: 'exact', cents: -40 },
          { status: 'wrong', cents: -2 },
        ];
        const s = summariseIntonation(notes);
        log.push(`summary: heard ${s.heard} · missed ${s.missed} · sharp ${s.sharp} · flat ${s.flat} · centred ${s.centred}`);
        if (s.heard !== 4) problems.push(`heard ${s.heard} of 4`);
        if (s.missed !== 1) problems.push(`missed ${s.missed} instead of 1`);
        if (s.sharp !== 1) problems.push(`sharp ${s.sharp} instead of 1`);
        if (s.flat !== 1) problems.push(`flat ${s.flat} instead of 1`);
        if (s.centred !== 2) problems.push(`centred ${s.centred} instead of 2`);
        // A missed note carries cents 0 in the analysis, and must never be read
        // as a perfectly tuned note.
        if (isHeard({ status: 'missed', cents: 0 })) problems.push('a missed note counted as heard');
        if (!isHeard({ status: 'exact', cents: 0 })) problems.push('a centred note did not count as heard');
      }

      /* ── 5. The lane itself ─────────────────────────────────────────── */
      {
        // Two notes per bar in the drawing, so the x positions are the notes'.
        const marks = [
          { x: 100, cents: 5 },
          { x: 140, cents: 38 },
          { x: 180, cents: null },
          { x: 220, cents: -26 },
          { x: 260, cents: 70 },
        ];
        const lane = intonationLane({ marks, centre: 60, half: 20, left: 40, right: 300 });
        const count = (re) => (lane.markup.match(new RegExp(re, 'g')) || []).length;
        log.push(
          `lane: ${lane.markup.length} chars · stems ${count('intonation-stem')} · dots ${count('intonation-dot')} · ` +
            `rings ${count('intonation-missed')} · chevrons ${count('intonation-over')} · bottom ${lane.bottom}`,
        );
        if (count('intonation-stem') !== 4) problems.push(`${count('intonation-stem')} stems for four heard notes`);
        if (count('intonation-dot') !== 4) problems.push(`${count('intonation-dot')} dots for four heard notes`);
        if (count('intonation-missed') !== 1) problems.push(`${count('intonation-missed')} rings for one missed note`);
        if (!/intonation-over/.test(lane.markup)) problems.push('an off-the-scale reading has no chevron');
        // The lane reports how far down it reaches, so the next system can clear it.
        if (lane.bottom !== 80) problems.push(`the lane bottom is ${lane.bottom}, not 80`);
        // Each stem is drawn at its own note's x — the whole point of the lane.
        for (const mark of marks) {
          const at = mark.cents == null ? `cx="${mark.x}"` : `x1="${mark.x}"`;
          if (!lane.markup.includes(at)) problems.push(`no mark at x=${mark.x}`);
        }
        // Everything stays inside the lane it was given.
        if (!lane.markup.includes('x="40"')) problems.push('the band does not start at the left edge');
        if (intonationLane({ marks: [], centre: 60, left: 0, right: 10 }).markup !== '')
          problems.push('an empty take drew something');
      }

      document.getElementById('out').textContent = problems.length
        ? `INTONATION FAILED\n${problems.map((p) => `· ${p}`).join('\n')}\n\n${log.join('\n')}`
        : `INTONATION OK\n${log.join('\n')}`;
      document.title = problems.length ? 'INTONATION FAILED' : 'INTONATION OK';

      fetch('/result', {
        method: 'POST',
        body: JSON.stringify({ stage: 'intonation', problems, log: log.join('\n') }, null, 2),
      });
    </script>
  </body>
</html>
